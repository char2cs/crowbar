version: "2"
run:
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - gochecknoinits
    - gocyclo
    - godox
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    exhaustive:
      default-signifies-exhaustive: false
    godox:
      # "BUG" is left out on purpose: prose like "the bug this fixes" is not a marker.
      keywords:
        - TODO
        - FIXME
        - HACK
    funlen:
      lines: 100
      statements: 50
    gocyclo:
      min-complexity: 15
    nestif:
      min-complexity: 2
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.Sleep$
          msg: "sleeping is a race waiting to happen: wait on a channel, a context or an injected clock"
        - pattern: ^fmt\.Print(f|ln)?$
          msg: "internal/ code logs through slog, it never prints to stdout"
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      enable-all-rules: false
      rules:
        - name: early-return
          severity: warning
          disabled: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - funlen
          - gocyclo
        path: _test\.go
      - linters:
          - gosec
          - dupl
        path: _test\.go
      # Tests may sleep (e.g. to let a real clock tick past mtime granularity).
      - linters:
          - forbidigo
        path: _test\.go
        text: time\.Sleep
      # fmt.Print* is only banned in internal/ (cmd/ and tools may print).
      - linters:
          - forbidigo
        path-except: ^internal/
        text: fmt\.Print
      - linters:
          - gosec
        text: 'G404:'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Ratchet: only lines changed since the 2026-09-24 guardrails baseline are
  # gated. The pre-existing backlog is reported by `make lint-backlog`; shrink
  # it, then move this rev forward (or drop it) once the backlog is zero.
  new-from-rev: 70ec4303a7702206f271a54f752803f792a23677
  new: false
  fix: false
severity:
  default: error
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/char2cs/crowbar
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
