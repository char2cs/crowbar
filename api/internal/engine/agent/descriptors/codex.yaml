# Validated against codex 0.139.0 (Phase-0 spike). Documentation only.
id: codex
spawn:
  cmd: codex
  interactive_required: true
  forbid_flags: ["exec"]
  args: ["--dangerously-bypass-hook-trust"]
session:
  resume: { arg: "resume {id}" }
config_injection:
  - set_env:    { name: CODEX_HOME, value: "{tmp}/codex-home" }
  - write_file: { path: "{tmp}/codex-home/auth.json", from: "~/.codex/auth.json" }
  - write_file:
      path: "{tmp}/codex-home/config.toml"
      content: |
        [projects."{cwd}"]
        trust_level = "trusted"
  - write_file:
      path: "{tmp}/codex-home/hooks.json"
      content: |
        {"hooks":{
          "SessionStart":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook session_start --segment {segid} --provider {provider} --project {project_id} --repo {repo_id} --workspace {workspace_id}"}]}],
          "UserPromptSubmit":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook user_prompt --segment {segid} --provider {provider} --project {project_id} --repo {repo_id} --workspace {workspace_id}"}]}],
          "Stop":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook turn_stop --segment {segid} --provider {provider} --project {project_id} --repo {repo_id} --workspace {workspace_id}"}]}]
        }}
hooks:
  format: json
  events:
    session_start: { session_id: session_id }
    user_prompt:   { message: prompt }
    turn_stop:     { session_id: session_id, message: last_assistant_message }
handoff_inject:
  - pass_arg: { positional: "{handoff}" }
# codex has no per-invocation system-prompt flag, but obeys an additive
# instruction placed at $CODEX_HOME/AGENTS.md (verified live against codex
# 0.139.0). Writing here — rather than reusing handoff_inject's positional
# pass_arg — keeps codex's first turn as the user's real prompt instead of
# hijacking it with the title instruction.
system_prompt_inject:
  - write_file: { path: "{tmp}/codex-home/AGENTS.md", content: "{system_prompt}" }
