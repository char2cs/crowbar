# Validated against codex 0.139.0 (Phase-0 spike; see
# docs/superpowers/specs/2026-07-05-crowbar-agentic-engine-design.md §1).
# This is documentation only, not a wired version check.
id: codex
spawn:
  cmd: codex
  interactive_required: true
  forbid_flags: ["exec"]
  args: ["--dangerously-bypass-hook-trust"]
session:
  resume: { arg: "resume {id}" }
config_injection:
  - set_env:    { name: CODEX_HOME, value: "{tmp}/codex-home" }
  - write_file: { path: "{tmp}/codex-home/auth.json", from: "~/.codex/auth.json" }
  - write_file: { path: "{tmp}/codex-home/config.toml", content: "[projects.\"{cwd}\"]\ntrust_level = \"trusted\"\n" }
  - render_hooks: { into: "{tmp}/codex-home/hooks.json" }
hooks:
  session_start:
    provider_event: SessionStart
    fields: { session_id: "$.session_id", transcript: "$.transcript_path" }
  turn_stop:
    provider_event: Stop
    fields: { session_id: "$.session_id", transcript: "$.transcript_path" }
handoff_inject:
  - pass_arg: { positional: "{handoff}" }
