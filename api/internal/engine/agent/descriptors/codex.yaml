# Validated against codex 0.139.0 (Phase-0 spike). Documentation only.
id: codex
display_name: Codex
icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/></svg>'
spawn:
  cmd: codex
  interactive_required: true
  forbid_flags: ["exec"]
  # codex has no single "auto" switch: its equivalent is a workspace-write sandbox
  # with model-decided approvals — it works inside the workspace without asking and
  # only escalates to the user when it needs to step OUTSIDE it. NOT
  # --dangerously-bypass-approvals-and-sandbox, which drops the sandbox entirely.
  args:
    - "--dangerously-bypass-hook-trust"
    - "--sandbox"
    - "workspace-write"
    - "--ask-for-approval"
    - "on-request"
session:
  resume: { arg: "resume {id}" }
# Crowbar does NOT own codex's home. It runs codex against the user's real
# ~/.codex and injects everything it needs as session-layer config overrides
# (-c), which codex honours for hooks — verified against 0.139.0: SessionStart,
# UserPromptSubmit and Stop all fire with no CODEX_HOME override and no file
# written anywhere.
#
# The alternative — pointing CODEX_HOME at a Crowbar-owned directory to drop a
# hooks.json into it — is what the descriptor used to do, and it was wrong twice
# over. It made Crowbar the custodian of codex's SESSIONS (they live in
# $CODEX_HOME), so Crowbar deleted codex's own session whenever it cleaned up the
# directory: switching away from codex destroyed the thread, and switching back
# killed the CLI on startup with "no rollout found for thread id ...". And it hid
# the user's real codex from itself — no skills, no MCP servers, no memories, no
# model prefs, none of their own hooks.
#
# A provider owns its sessions. Crowbar only observes.
config_injection:
  # codex prompts to self-update on startup, which would eat the first keystrokes
  # in the chat pane.
  - pass_arg: { arg: "-c", value: 'check_for_update_on_startup=false' }
  # workspace-write DENIES NETWORK, and on macOS a unix-socket connect IS network — so a
  # sandboxed codex cannot reach the daemon at all. That is not theoretical: `crowbar chat
  # rename` is the one command Crowbar asks the AGENT to run, an agent runs it as a TOOL,
  # a tool runs inside the sandbox, and so it died every single time on
  #
  #   crowbar chat rename --segment <id>: connect: operation not permitted
  #
  # which is why codex could never title its own chat. It hid for so long because codex's
  # HOOKS are unaffected — codex spawns those OUTSIDE the sandbox — so sessions bound and
  # turns landed and everything looked healthy.
  #
  # This grants NETWORK, not the filesystem: codex still cannot write outside the
  # workspace, so the sandbox keeps doing the job it is there for. What it ends is an
  # asymmetry nobody chose. claude runs with NO kernel sandbox at all (--permission-mode
  # auto is a policy inside claude, not a seatbelt) and has had unrestricted network the
  # whole time; codex had none, so it could not fetch a doc or install a package while its
  # peer could. Even after this, codex remains the more confined of the two.
  #
  # And there is no gentler knob to reach for: `--full-auto` was REMOVED in 0.139 ("use
  # --sandbox workspace-write instead"), so workspace-write IS codex's auto mode. The
  # sandbox is not a setting we picked over a laxer one — it is the mode — and network is
  # the one dimension of it we actually need back.
  - pass_arg: { arg: "-c", value: 'sandbox_workspace_write.network_access=true' }
  # The hooks Crowbar listens on. They are the ONLY thing it injects: the segment
  # id travels in the command itself, so nothing is written to disk and nothing of
  # the user's is overridden — their own ~/.codex/hooks.json still fires alongside
  # these.
  - pass_arg:
      arg: "-c"
      value: 'hooks.SessionStart=[{hooks=[{type="command",command="{crowbar_hook} hook session_start --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.UserPromptSubmit=[{hooks=[{type="command",command="{crowbar_hook} hook user_prompt --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.Stop=[{hooks=[{type="command",command="{crowbar_hook} hook turn_stop --segment {segid} --provider {provider} {scope_flags}"}]}]'
hooks:
  format: json
  # codex's hooks are not only its user's. With `[features] memories = true` its
  # Memory Writing Agent runs as an INTERNAL session inside the SAME codex process,
  # so it inherits the `-c hooks.*` above and fires the full lifecycle at Crowbar —
  # SessionStart, UserPromptSubmit, Stop, SessionEnd — on a session the user never
  # opened. Captured live from codex 0.146.0, alongside the real session's hooks:
  #
  #   real:     session_id 019fafae-f27f…  source startup  transcript_path <rollout>
  #             cwd <worktree>             model gpt-5.6-sol    permission_mode default
  #   internal: session_id 019fafaf-4f2c…  source startup  transcript_path NULL
  #             cwd ~/.codex/memories      model gpt-5.6-terra  permission_mode bypassPermissions
  #
  # `source` is IDENTICAL, so no move label can separate them (see reducer.go, which
  # must never branch on that vocabulary anyway). What separates them is that the
  # internal one is not a conversation: transcript_path is null, because it has no
  # rollout — and a session with no rollout is one codex itself cannot resume, so it
  # was never something Crowbar could host. Requiring the transcript therefore drops
  # every hook of every internal session codex runs, present and future, without
  # Crowbar having to enumerate them.
  #
  # NOT the other three columns. cwd would work today but needs symlink- and
  # case-exact path comparison against the worktree to be safe, and model and
  # permission_mode are a user's to configure — `consolidation_model` is a config key.
  require_payload_fields: [transcript_path]
  events:
    session_start: { session_id: session_id }
    user_prompt:   { message: prompt }
    turn_stop:     { session_id: session_id, message: last_assistant_message }
# codex ships no --append-system-prompt (the upstream request for it is closed
# unimplemented) and its positional [PROMPT] IS the user's first message — passing
# the handoff there is what made codex answer the handoff on sight instead of
# waiting for the user. `developer_instructions` is the documented additive
# channel ("Additional developer instructions injected into the session") and is
# verified against codex 0.139.0: the CLI comes up with an EMPTY composer, starts
# no turn, and answers from the injected context once the user types.
# NOT model_instructions_file — that REPLACES codex's built-in system prompt.
context_inject:
  - pass_arg: { arg: "-c", value: "developer_instructions={context}" }
# A RESUMED codex session cannot be told anything through config. Verified against
# 0.139.0: `codex resume` rebuilds the conversation from its rollout .jsonl, which
# never records developer instructions — a fresh `-c developer_instructions=` is
# ignored, a fresh AGENTS.md is not re-read, and `codex fork` behaves identically.
# The ONLY channel that reaches a resumed codex is a USER MESSAGE.
#
# So it is handed a POINTER, not a transcript: the conversation is already on disk
# (Crowbar's ledger, one file per turn), and an agent reads files. Pasting the whole
# handed-off exchange into the chat instead — which is what this used to do — dumped
# a wall of text into the transcript for the user to scroll past, every single switch.
resume_context_inject:
  - pass_arg: { positional: "{context_pointer}" }
