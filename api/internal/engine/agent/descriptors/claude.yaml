# Validated against claude 2.1.201 (Phase-0 spike; see
# docs/superpowers/specs/2026-07-05-crowbar-agentic-engine-design.md §1).
# This is documentation only, not a wired version check.
id: claude
spawn:
  cmd: claude
  interactive_required: true
  forbid_flags: ["-p", "--print"]
  env:
    clear: ["CLAUDE_CODE_CHILD_SESSION", "CLAUDECODE"]
session:
  resume: { arg: "--resume {id}" }
config_injection:
  - render_hooks: { into: "{tmp}/settings.json" }
  - pass_arg:     { arg: "--settings", value: "{tmp}/settings.json" }
hooks:
  session_start:
    provider_event: SessionStart
    fields: { session_id: "$.session_id", transcript: "$.transcript_path" }
  turn_stop:
    provider_event: Stop
    fields: { session_id: "$.session_id", transcript: "$.transcript_path" }
handoff_inject:
  - pass_arg: { arg: "--append-system-prompt", value: "{handoff}" }
