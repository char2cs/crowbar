# Validated against claude 2.1.201 (Phase-0 spike). Documentation only.
id: claude
spawn:
  cmd: claude
  interactive_required: true
  forbid_flags: ["-p", "--print"]
  env:
    clear: ["CLAUDE_CODE_CHILD_SESSION", "CLAUDECODE"]
session:
  resume: { arg: "--resume {id}" }
config_injection:
  - write_file:
      path: "{tmp}/settings.json"
      content: |
        {"hooks":{
          "SessionStart":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook session_start --segment {segid} --provider {provider} --project {project_id} --repo {repo_id} --workspace {workspace_id}"}]}],
          "UserPromptSubmit":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook user_prompt --segment {segid} --provider {provider} --project {project_id} --repo {repo_id} --workspace {workspace_id}"}]}],
          "Stop":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook turn_stop --segment {segid} --provider {provider} --project {project_id} --repo {repo_id} --workspace {workspace_id}"}]}]
        }}
  - pass_arg: { arg: "--settings", value: "{tmp}/settings.json" }
hooks:
  format: json
  events:
    session_start: { session_id: session_id }
    user_prompt:   { message: prompt }
    turn_stop:     { session_id: session_id, message: last_assistant_message }
handoff_inject:
  - pass_arg: { arg: "--append-system-prompt", value: "{handoff}" }
system_prompt_inject:
  - pass_arg: { arg: "--append-system-prompt", value: "{system_prompt}" }
