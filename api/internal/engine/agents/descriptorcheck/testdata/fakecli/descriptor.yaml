# The scripted fake CLI's descriptor. BIN is replaced by the test binary,
# which re-executes as the fake (fakecli_test.go) and follows the transcript
# FAKECLI_SCRIPT names.
id: fakecli
display_name: Fake CLI
runtime:
  transport: hooks
  hotswap: true
  hooks:
    format: json
    delivery: http
spawn:
  cmd: BIN
  interactive_required: true
  args: ["--fake-tui"]
session:
  resume: { arg: "--resume {id}" }
  refused: { exit_code: 1, needles: ["No conversation found with session ID"] }
  persists: turn_start
hooks_injection:
  - write_file:
      path: "{tmp}/hook.curl"
      content: |
        header = "X-Crowbar-Runner-Token: {runner_token}"
        data-binary = "@-"
  - pass_arg: { arg: "--hook", value: "session_start={hook_curl} {hook_url}/session_start" }
  - pass_arg: { arg: "--hook", value: "user_prompt={hook_curl} {hook_url}/user_prompt" }
  - pass_arg: { arg: "--hook", value: "turn_stop={hook_curl} {hook_url}/turn_stop" }
terminal_prompts:
  - kind: workspace_trust
    needle: "Trust this folder?"
events:
  session_start:
    required: [session_id]
    in: session_start
    map: { session_id: session_id }
  user_prompt:
    required: [session_id, message]
    in: user_prompt
    map: { session_id: session_id, message: prompt }
  turn_stop:
    required: [session_id]
    in: turn_stop
    map: { session_id: session_id, message: last_assistant_message }
