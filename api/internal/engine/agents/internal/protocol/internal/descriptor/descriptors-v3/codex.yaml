# Codex — v3, event-centric. A faithful translation of the v2 hooks descriptor: same
# transport, same events, same fields, with alternation respelled `||`.
#
# The app-server API transport is NOT used here. It is verified and ready
# (descriptors-v3/experimental/codex-api.yaml, replayed against recorded traffic) but
# it carries fewer events than the hook transport — no subagent, compaction or
# session_end notifications — so adopting it is a capability change staged separately
# (design spec 8.1).
id: codex
display_name: Codex
icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/></svg>'

runtime:
  transport: hooks
  hotswap: true
  hooks:
    format: json
    delivery: http
    require_payload_fields: [transcript_path]
  spawn:
    cmd: codex

events:
  session_start:
    in: SessionStart
    map: { session_id: session_id, model: model }

  user_prompt:
    in: UserPromptSubmit
    map: { message: prompt }

  turn_stop:
    in: Stop
    map: { session_id: session_id, message: last_assistant_message }

  tool_pre:
    in: PreToolUse
    map:
      session_id:  session_id
      tool_id:     tool_use_id
      tool_name:   tool_name
      tool_target: tool_input.file_path || tool_input.command || tool_input.path
      tool_input:  tool_input

  tool_post:
    in: PostToolUse
    map:
      session_id:  session_id
      tool_id:     tool_use_id
      tool_name:   tool_name
      tool_target: tool_input.file_path || tool_input.command || tool_input.path
      tool_input:  tool_input
      tool_result: tool_response
      duration_ms: duration_ms

  subagent_pre:
    in: SubagentStart
    map: { session_id: session_id, subagent_id: agent_id, agent_type: agent_type }

  subagent_post:
    in: SubagentStop
    map: { session_id: session_id, subagent_id: agent_id, agent_type: agent_type }

  permission:
    ask: PermissionRequest
    timeout_seconds: 270
    map:
      session_id:  session_id
      message:     tool_name
      tool_name:   tool_name
      tool_target: tool_input.file_path || tool_input.command || tool_input.path
      tool_input:  tool_input
    # OBSERVED, NOT ANSWERABLE. v2 declared no answer: block for codex, so a decision
    # made in Crowbar reached nobody — the human answers in the terminal. Preserved
    # exactly, but now stated: inventing a response template without a verified one
    # would be inventing provider protocol.
    answerable: false

  compact_pre:
    in: PreCompact
    map: { session_id: session_id, trigger: trigger }

  compact_post:
    in: PostCompact
    map: { session_id: session_id, trigger: trigger }

  session_end:
    in: SessionEnd
    map: { session_id: session_id, reason: reason }

# --- carried across from v2 unchanged -------------------------------------
# Validated against codex 0.139.0, except the mcp_servers.crowbar entries below,
# which were first exercised by a live tool call on 0.146.0.
spawn:
  cmd: codex
  interactive_required: true
  forbid_flags: ["exec"]
  # codex has no single "auto" switch: workspace-write + on-request is its
  # equivalent — it works inside the workspace and escalates only to step outside.
  # NOT --dangerously-bypass-approvals-and-sandbox, which drops the sandbox.
  args:
    - "--dangerously-bypass-hook-trust"
    - "--sandbox"
    - "workspace-write"
    - "--ask-for-approval"
    - "on-request"
session:
  resume: { arg: "resume {id}" }
presentation:
  prompt_submit:
    strategy: restart_tui
    fresh:
      - pass_arg: { positional: "--" }
      - pass_arg: { positional: "{message}" }
    resume:
      - pass_arg: { positional: "--" }
      - pass_arg: { positional: "{message}" }
  # `debug prompt-input` renders the instructions codex would make model-visible,
  # without starting a model turn. Its native /skills menu may hold more, hence
  # model_visible rather than complete.
  slash_catalog:
    completeness: model_visible
    timeout_ms: 10000
    max_stdout_bytes: 4194304
    max_stderr_bytes: 262144
    max_items: 200
    pipeline:
      adapter: json_text_section
      command: ["debug", "prompt-input"]
      text_path: "[].content[].text"
      start_marker: "<skills_instructions>"
      end_marker: "</skills_instructions>"
      # A skill name may itself be plugin-qualified with colons, so the field
      # delimiter is the first colon FOLLOWED BY WHITESPACE (`plugin:skill: Desc`).
      item_pattern: '(?m)^- (?P<name>[^\r\n]+?):\s+(?P<description>.*?)(?:\s+\((?:file|orchestrator resource|environment resource|custom resource):[^\r\n]*\))?\r?$'
      item:
        label: "{name}"
        description: "{description}"
        insert_text: "${name} "
        source: "model-visible"
# A SNAPSHOT OF A LIVE ENUMERATION, unlike claude's declared list: measured with
# `codex debug models` (account metadata, not a model turn), in codex's own priority
# order, omitting codex-auto-review which reports visibility: hide. It still drifts —
# a model added upstream changes nothing here until somebody re-runs the command.
model:
  available: [gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-5.5, gpt-5.4, gpt-5.4-mini]
  strategy: restart_tui
  apply:
    - pass_arg: { arg: "--model", value: "{model}" }
effort:
  # THE CASE THE PER-MODEL MAP EXISTS FOR — the levels genuinely vary. There is
  # deliberately NO "*" fallback: an unlisted model must answer with no levels
  # rather than with another model's.
  available:
    gpt-5.6-sol:   [low, medium, high, xhigh, max, ultra]
    gpt-5.6-terra: [low, medium, high, xhigh, max, ultra]
    gpt-5.6-luna:  [low, medium, high, xhigh, max]
    gpt-5.5:       [low, medium, high, xhigh]
    gpt-5.4:       [low, medium, high, xhigh]
    gpt-5.4-mini:  [low, medium, high, xhigh]
  strategy: restart_tui
  apply:
    # codex has no --effort; `-c key=value` is its config-override channel.
    - pass_arg: { arg: "-c", value: 'model_reasoning_effort="{effort}"' }
# THE LAW THIS DESCRIPTOR IS BUILT ON: Crowbar does not own ~/.codex. Everything is
# a session-layer `-c` override, so nothing is written and the user's own skills, MCP
# servers, memories and hooks all stay live.
#
# Pointing CODEX_HOME at a Crowbar-owned directory — what this used to do — made
# Crowbar the custodian of codex's SESSIONS, so cleaning up the directory destroyed
# the user's thread and switching back died with "no rollout found for thread id".
config_injection:
  # codex prompts to self-update on startup, which eats the pane's first keystrokes.
  - pass_arg: { arg: "-c", value: 'check_for_update_on_startup=false' }
  # TUI-NATIVE modals, suppressed rather than answered: the TUI draws these itself,
  # no hook fires, and nothing Crowbar can send reaches them.
  #
  # Only the three unambiguous ones. `fast_default_opt_out` is a SERVICE-TIER choice
  # the user owns, and the migration prompts are left alone because their key
  # spelling contains dots, which a TOML dotted-key override parses as nested tables.
  #
  # An unknown `-c` key is inert — `--strict-config` validates config.toml only and
  # accepts `-c notice.total_nonsense_key=true` — so a wrong key here can break
  # nothing, it can only leave a modal showing.
  - pass_arg: { arg: "-c", value: 'notice.hide_rate_limit_model_nudge=true' }
  - pass_arg: { arg: "-c", value: 'notice.hide_full_access_warning=true' }
  - pass_arg: { arg: "-c", value: 'notice.hide_world_writable_warning=true' }
  # workspace-write DENIES NETWORK, and on macOS a unix-socket connect IS network, so
  # a sandboxed codex cannot reach the daemon at all. Found through the shell titling
  # command, which died every time on `connect: operation not permitted`; it hid
  # because codex spawns HOOKS outside the sandbox, so everything else looked healthy.
  #
  # This grants network, not the filesystem. claude runs with no kernel sandbox at
  # all, so even after this codex remains the more confined of the two.
  - pass_arg: { arg: "-c", value: 'sandbox_workspace_write.network_access=true' }
  # The hooks Crowbar listens on, and the only thing it injects. The user's own
  # ~/.codex/hooks.json still fires alongside these.
  - pass_arg:
      arg: "-c"
      value: 'hooks.SessionStart=[{hooks=[{type="command",command="{crowbar_hook} hook session_start --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.UserPromptSubmit=[{hooks=[{type="command",command="{crowbar_hook} hook user_prompt --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.Stop=[{hooks=[{type="command",command="{crowbar_hook} hook turn_stop --segment {segid} --provider {provider} {scope_flags}"}]}]'
  # codex 0.146.0 fires these event names — extracted from the binary's hook schema —
  # but their PAYLOAD FIELDS have not been captured live: the account hit its usage
  # limit mid-probe. Every mapping degrades to empty rather than to wrong if a field
  # sits elsewhere. Re-capture and confirm.
  #
  # codex exposes no Notification event. Absent capability, absent UI.
  - pass_arg:
      arg: "-c"
      value: 'hooks.PreToolUse=[{hooks=[{type="command",command="{crowbar_hook} hook tool_pre --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.PostToolUse=[{hooks=[{type="command",command="{crowbar_hook} hook tool_post --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.SubagentStart=[{hooks=[{type="command",command="{crowbar_hook} hook subagent_pre --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.SubagentStop=[{hooks=[{type="command",command="{crowbar_hook} hook subagent_post --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.PermissionRequest=[{hooks=[{type="command",command="{crowbar_hook} hook permission --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.PreCompact=[{hooks=[{type="command",command="{crowbar_hook} hook compact_pre --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.PostCompact=[{hooks=[{type="command",command="{crowbar_hook} hook compact_post --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.SessionEnd=[{hooks=[{type="command",command="{crowbar_hook} hook session_end --segment {segid} --provider {provider} {scope_flags}"}]}]'
mcp_injection:
  - pass_arg: { arg: "-c", value: 'mcp_servers.crowbar.command="{crowbar}"' }
  - pass_arg:
      arg: "-c"
      value: 'mcp_servers.crowbar.args=["mcp","--segment","{segid}","--token","{runner_token}","--project","{project_id}","--workspace","{workspace_id}","--repo","{repo_id}"]'
  # codex starts an MCP server with a SCRUBBED environment — a fixed allowlist and
  # nothing else — and CROWBAR_HOME does not survive it. That variable is the ONLY
  # thing selecting which daemon socket a `crowbar` subprocess dials, so without this
  # a codex relay walks past the daemon that spawned it and dials the default one:
  # off the default home the tool surface is entirely DEAD (the runner token is HMAC'd
  # with a per-process secret, so it cannot validate there), and a runner id and
  # bearer token cross a boundary they were never scoped for.
  #
  # FORWARDED, not injected with a literal: an unset CROWBAR_HOME must stay unset in
  # the child, because unset is what selects the default home.
  - pass_arg: { arg: "-c", value: 'mcp_servers.crowbar.env_vars=["CROWBAR_HOME"]' }
  # Without this codex STOPS on every Crowbar tool call and waits for a human —
  # `on-request` is its approval policy for the SHELL, and MCP calls are gated
  # separately and default to prompting.
  #
  # SERVER-WIDE by owner decision (2026-07-29), not a workaround: an agent that acts
  # without a per-call modal is the point of this surface. It is also the only form
  # that does not rot — the per-tool key it replaced needed a line per tool, and an
  # omitted line stalls that tool on a modal nobody in a Crowbar pane can answer.
  #
  # `approve` is the one mode verified live to suppress it. `auto` is deliberately
  # unused: 0.146.0 documents nothing about it, and a mode nobody can describe is not
  # one to grant a write with.
  - pass_arg:
      arg: "-c"
      value: 'mcp_servers.crowbar.default_tools_approval_mode="approve"'
# codex ships no --append-system-prompt, and its positional [PROMPT] IS the user's
# first message — passing the handoff there made codex answer it on sight.
# developer_instructions is the documented additive channel and leaves the composer
# empty. NOT model_instructions_file, which REPLACES codex's built-in system prompt.
context_inject:
  - pass_arg: { arg: "-c", value: "developer_instructions={context}" }
# A RESUMED codex session cannot be told anything through config: `codex resume`
# rebuilds from its rollout, which never records developer instructions. The ONLY
# channel that reaches it is a USER MESSAGE.
#
# So it is handed a POINTER, not a transcript — the conversation is already on disk
# and an agent reads files. Pasting the whole exchange in, which is what this used to
# do, dumped a wall of text into the chat on every switch.
resume_context_inject:
  - pass_arg: { positional: "{context_pointer}" }
# Blocking modals no hook reports — see claude.yaml's terminal_prompts. codex asks
# about trust before it reports anything, so a chat behind that dialog renders as a
# dead pane.
#
# UNKINDED, unlike claude's pair, and that is honest rather than an oversight:
# NEITHER line says anything about trust. "Press enter to continue" is what codex
# would print for any confirmation, so all this can truthfully report is THAT the CLI
# is blocked. A needle gets a kind when a specific one has been captured, never
# before.
terminal_prompts:
  - needle: "Press enter to continue"
  # A SECOND modal, and a different sentence: the needle above does not match it.
  # Reduced, they share a prefix and diverge —  `pressentertocontinue` against
  # `pressentertoconfirmoresctogoback` — so the substring search finds nothing.
  - needle: "Press enter to confirm or esc to go back"
# Messages codex paints INSTEAD of finishing a turn: nobody is being asked anything,
# the attempt is simply over. Captured live from 0.146.0 — a prompt was accepted,
# UserPromptSubmit fired, the turn opened, and codex painted this and sat there. No
# Stop, no SessionEnd, no exit, so the runner-exit reconcile never ran either; the
# turn stayed open for 44 minutes and closed only because a human switched provider.
#
# `ends_turn: true` is the whole claim: the banner is painted BECAUSE the attempt
# ended, so finding it on a screen that has not moved for the quiet period is
# positive evidence the CLI is not working. Only the FIRST LINE is declared — the
# URLs and reset time are account- and clock-specific, and the capture rule reads
# them off the screen into the chat verbatim.
#
# NOT an idle needle, and none is declared: codex's composer placeholder ROTATES
# between sessions. Its BUSY indicator was never measured either — the account was
# rate-limited throughout — and nothing in the detector depends on recognising one.
terminal_notices:
  - kind: usage_limit
    needle: "You've hit your usage limit"
    ends_turn: true

