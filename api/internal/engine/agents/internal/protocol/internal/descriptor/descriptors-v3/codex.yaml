# Codex — v3, event-centric, MIXED TRANSPORT: the app-server API carries the
# interactive core (turns, streaming, answerable permissions, telemetry,
# interrupt, compact); five events with no api-transport equivalent still
# ride hooks (declared per-event below).
#
# `attach` is declared WITHOUT `hotswap`: confirmed live (codex-cli 0.149.1)
# that a second live client on the same app-server process fails outright
# ("no rollout found"), and codex enforces one writer per thread regardless.
# It is idle-only sequential handoff instead — see runner/attach.go's
# SwitchToTerminal, which tears the api connection down first, then forks a
# plain hooks-transport CLI, and switching back re-establishes the api
# connection over the same session via `resume:` below.
id: codex
display_name: Codex
icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/></svg>'

runtime:
  transport: api
  api:
    protocol: jsonrpc2
    serve:  [codex, app-server, --listen, "unix://{socket}"]
    # Never rendered at spawn (see applyAPITransport's Hotswap gate); only
    # SwitchToTerminal forks this, and only once idle.
    attach: [codex, resume, "{session_id}"]
    handshake: { call: initialize }
  hooks:
    format: json
    delivery: http
    require_payload_fields: [transcript_path]
  spawn:
    cmd: codex

events:
  # codex's own spawned config.toml wires hooks.SessionStart unconditionally,
  # so this canonical event has two live shapes: thread/started (thread.id,
  # api transport) and a flat session_id delivery (hooks fallback). Every
  # `||`-fallback event below shares this same dual-shape hazard.
  session_start:
    in: thread/started
    map: { session_id: "thread.id || session_id" }

  # item/started is a SUM TYPE selected by item.type. tool_id specifically is
  # load-bearing: an unresolved id makes toolID() mint a fresh fallback per
  # call, so tool_pre/tool_post never match and OpenWork reports the chat as
  # perpetually mid-turn — confirmed live and by
  # TestUsecase_OpenWork_ReportsAToolCallTheProviderNeverClosed.
  user_prompt:
    in: item/started
    when: { item.type: userMessage }
    map:
      session_id: "threadId || session_id"
      message:    "item.content[type=text].text || prompt"

  # turn.lastAgentMessage does not exist — the answer is an item IN a list.
  #
  # turn/completed is a SUM TYPE on turn.status (completed|interrupted|failed|
  # inProgress — codex's own TurnStatus enum). Ungated, this event also swallowed
  # every FAILED turn: it recorded an ordinary stop whose message resolved to
  # nothing, so the user saw the spinner end on an empty reply and turn.error was
  # discarded.
  #
  # DELIBERATELY UNGATED all the same — turn_failed below carries the narrow
  # `failed` clause and dispatch.Resolve offers it FIRST (sorted name order), so
  # the split works without this event having to enumerate the statuses it wants.
  # Enumerating them would be a wedge: a status this list forgot — `inProgress`,
  # or anything codex adds later — would match NEITHER event, and a turn that
  # never receives a close is a spinner that never stops. Falling through to an
  # ordinary stop is the safe default. An interrupt is an ordinary stop too: the
  # human asked for it.
  turn_stop:
    in: turn/completed
    map:
      session_id: "threadId || session_id"
      message:    "turn.items[type=agentMessage].text || last_assistant_message"
      # Not read for the reply itself — it is what lets Go tell this apart
      # from thread/compact/start's own turn/started..completed wrapper,
      # which rides this SAME event with nothing else on the frame saying
      # so (confirmed live: a compaction's turn/completed is byte-for-byte
      # the same shape — items: [], itemsView: "notLoaded", status:
      # "completed" — as a genuinely interrupted real turn's). See
      # compact_pre below and turn/compaction.go.
      turn_id:    turn.id

  # The other half of that sum type. No `message:` deliberately: a failed turn's
  # items are not reliably populated, and closeAssistantTurn has already salvaged
  # whatever message_delta streamed before the failure — mapping it here would
  # only risk overwriting real text with an empty string.
  turn_failed:
    in: turn/completed
    when: { turn.status: failed }
    map:
      session_id: "threadId || session_id"
      reason:     "turn.error.message || turn.status"
      detail:     turn.error.additionalDetails
      # See turn_stop's own turn_id comment — a compaction can fail too.
      turn_id:    turn.id

  # item.type values are codex's ThreadItem variants. webSearch and dynamicToolCall
  # were missing, so a turn that searched the web showed NO activity for that step.
  # collabAgentToolCall is the model's OWN multi-agent tool — spawnAgent, sendInput,
  # resumeAgent, wait, closeAgent (confirmed live: a real spawnAgent/wait/closeAgent
  # sequence renders as three ordinary tool rows this way, target and all). It is
  # deliberately mapped here rather than as subagent_pre/subagent_post below: a
  # StartSubagent/StopSubagent pair assumes one flat id with no nesting, but a
  # collab agent is a whole second THREAD (its own turn/item stream on this same
  # connection, confirmed live) with no "completed" kind of its own — what a caller
  # actually gets back is exactly this tool call's own id/status/target, the same
  # shape every other tool call already has. See subagent_pre below for what this
  # does NOT cover.
  #
  # tool_target is what the transcript actually renders (`name · target`); with it
  # unmapped every codex tool call read as the bare word "commandExecution". Each
  # variant keeps its target in its own field, hence the alternation:
  #   commandExecution -> command       fileChange  -> changes[0].path
  #   webSearch        -> query         mcpToolCall -> server (its tool is the NAME)
  #   collabAgentToolCall -> the prompt handed to spawnAgent, or (wait/closeAgent/
  #     sendInput/resumeAgent, which carry no prompt) the receiving thread's id.
  # changes[0] is an INDEX selector: FileUpdateChange.kind is an object
  # ({"type":"update"}), so no [field=value] selector can address that list.
  # receiverThreadIds[0] is the same INDEX selector, for the same reason: the list
  # holds exactly one id in every shape captured live, and a bare field name cannot
  # select "the first element of a list" any other way this grammar offers.
  tool_pre:
    in: item/started
    when: { item.type: commandExecution || fileChange || mcpToolCall || webSearch || dynamicToolCall || collabAgentToolCall }
    map:
      session_id:  "threadId || session_id"
      tool_id:     "item.id || tool_use_id"
      tool_name:   "item.tool || item.type || tool_name"
      tool_target: "item.command || item.query || item.server || item.changes[0].path || item.prompt || item.receiverThreadIds[0] || tool_input.file_path"
      tool_input:  item

  # tool_result was `item.content`, which exists on NO codex item — every tool
  # call completed with an empty result. The real output field differs per
  # variant: aggregatedOutput (commandExecution), result (mcpToolCall),
  # changes (fileChange), agentsStates (collabAgentToolCall — the spawned
  # agent's own status/message map, keyed by a thread id this grammar has no
  # way to select by since it is not a fixed field name; the whole map is
  # still a real result, just not one this file can pick a single value out
  # of).
  tool_post:
    in: item/completed
    when: { item.type: commandExecution || fileChange || mcpToolCall || webSearch || dynamicToolCall || collabAgentToolCall }
    map:
      session_id:  "threadId || session_id"
      tool_id:     "item.id || tool_use_id"
      tool_name:   "item.tool || item.type || tool_name"
      tool_target: "item.command || item.query || item.server || item.changes[0].path || item.prompt || item.receiverThreadIds[0] || tool_input.file_path"
      tool_result: "item.aggregatedOutput || item.result || item.changes || item.agentsStates || tool_response"
      duration_ms: "item.durationMs || duration_ms"

  # Fires on the SAME wire event as tool_post, separated only by item.status.
  # dispatch.Resolve tries candidates in sorted name order, so `tool_fail` is
  # offered before `tool_post` and its narrower when: wins on a failure; anything
  # else falls through to tool_post. tool_post deliberately declares NO status
  # clause: webSearch carries no status field at all, and a `when:` whose path is
  # missing never matches — gating it would have left every web search open
  # forever. collabAgentToolCall's own CollabAgentToolCallStatus enum has no
  # "declined" — only inProgress|completed|failed — so it can only ever match the
  # `failed` branch here, never the one commandExecution/fileChange/mcpToolCall
  # share with a human's own decline.
  tool_fail:
    in: item/completed
    when:
      item.type:   commandExecution || fileChange || mcpToolCall || dynamicToolCall || collabAgentToolCall
      item.status: failed || declined
    map:
      session_id:  "threadId || session_id"
      tool_id:     "item.id || tool_use_id"
      tool_name:   "item.tool || item.type || tool_name"
      tool_target: "item.command || item.query || item.server || item.changes[0].path || item.prompt || item.receiverThreadIds[0] || tool_input.file_path"
      tool_result: "item.aggregatedOutput || item.result || item.changes || item.agentsStates || tool_response"
      # collabAgentToolCall carries no .error field at all (confirmed live and
      # against the published schema) — item.status ("failed") is the only text
      # this variant has to fall back to, same as every other tool_error here.
      tool_error:  "item.error.message || item.status"
      duration_ms: "item.durationMs || duration_ms"

  # No index: this delta stream is already arrival-ordered.
  message_delta:
    in: item/agentMessage/delta
    map:
      session_id: threadId
      message_id: itemId
      text:       delta
      turn_id:    turnId

  # Codex spends most of a hard turn HERE and emits nothing else while it does
  # (captured live, codex-cli 0.149.1: item/started type reasoning, then
  # summaryPartAdded, then a run of summaryTextDelta, then item/completed). With
  # this unmapped the chat sat on a spinner and a rotating flavour verb for the
  # whole of it — the single biggest source of apparent dead air.
  #
  # summaryTextDelta, not textDelta: the summary is the stream codex actually
  # emits for a normal turn, and it is the human-readable one. Raw reasoning
  # content is gated behind a separate opt-in and was never observed live.
  #
  # index is summaryIndex — a thinking block is emitted in numbered parts, and
  # without it the parts of one block cannot be ordered.
  reasoning_delta:
    in: item/reasoning/summaryTextDelta
    map:
      session_id: threadId
      message_id: itemId
      text:       delta
      turn_id:    turnId
      index:      summaryIndex

  # A long command's output, line by line, while it runs. Captured live: a
  # five-second command emits one of these per line and nothing else, so without
  # it the tool row sat static for the whole run with no sign of progress.
  # itemId is the commandExecution item, which is the same id tool_pre opened the
  # call under — that is what puts the lines under the right running row.
  tool_output_delta:
    in: item/commandExecution/outputDelta
    map:
      session_id: threadId
      message_id: itemId
      text:       delta
      turn_id:    turnId

  # The agent's own to-do list for the turn, restated wholesale on each update.
  # Captured live: codex emits four of these across a three-step task, each
  # carrying the FULL list with one more step advanced.
  #
  # status_map is where codex's words become Crowbar's. Go never learns
  # "inProgress"; a provider that spells it differently changes this map and
  # nothing else.
  plan_update:
    in: turn/plan/updated
    # No `message:` — turn/plan/updated carries an `explanation`, but it was null
    # on every plan update captured live, and the replay harness rejects a path
    # that resolves to nothing.
    map:
      session_id: threadId
      turn_id:    turnId
    steps:
      items:  plan
      text:   step
      status: status
      status_map:
        pending:    pending
        inProgress: active
        completed:  done

  # tokenUsage nests under total/ — not tokenUsage.inputTokens directly.
  telemetry:
    in: thread/tokenUsage/updated
    map:
      session_id:              threadId
      input_tokens:            tokenUsage.total.inputTokens
      output_tokens:           tokenUsage.total.outputTokens
      context.used_tokens:     tokenUsage.total.totalTokens
      context.capacity_tokens: tokenUsage.modelContextWindow

  # Same dual-shape hazard as session_start: a hooks-delivered
  # PermissionRequest uses tool_name/tool_input, not this event's api names.
  permission:
    ask: item/permissions/requestApproval
    timeout_seconds: 270
    map:
      tool_name:  "tool || tool_name"
      tool_input: "params || tool_input"
    reply:
      allow: '{"decision":"approved"}'
      deny:  '{"decision":"denied","message":{reason_json}}'

  elicitation:
    ask: mcpServer/elicitation/request
    timeout_seconds: 270
    map:
      message: message
      schema:  requestedSchema
    reply:
      accept:  '{"action":"accept","content":{content_json}}'
      decline: '{"action":"decline"}'
      cancel:  '{"action":"cancel"}'

  # thread/start (fresh) and thread/resume (known but not yet loaded on this
  # connection) are separate calls, each producing {session_id} `action`
  # sends to. `input` is typed content blocks, not a bare string — the one
  # reason `send:` is a tree here rather than the flat shape below.
  #
  # sandbox/approvalPolicy come from permission_levels.levels[level].vars
  # (below) — the same source the hooks-transport spawn args render from, so
  # the two can never drift apart.
  prompt:
    fresh:
      - call: thread/start
        send:
          cwd:                   "{cwd}"
          sandbox:               "{permission.sandbox}"
          approvalPolicy:        "{permission.approvalPolicy}"
          # Confirmed live as codex's api-transport handoff channel (mirrors
          # context_inject's -c developer_instructions={context}) — without
          # this a thread/start-ed codex has no memory of a provider switch.
          developerInstructions: "{context}"
        capture:
          session_id: thread.id
    resume:
      - call: thread/resume
        send:
          threadId: "{session_id}"
          cwd:      "{cwd}"
    action:
      - call: turn/start
        send:
          threadId: "{session_id}"
          input:
            - type: text
              text: "{text}"
        # A cancel is scoped to the TURN, not the thread — captured here for
        # interrupt's own send: below, since thread/start never has it.
        capture:
          turn_id: turn.id

  # Confirmed live: turn/interrupt needs both threadId and turnId, or it
  # fails outright. The cancelled turn surfaces as an ordinary
  # turn/completed (status "interrupted"), and the connection survives it.
  interrupt:
    out: turn/interrupt
    send: { threadId: "{session_id}", turnId: "{turn_id}" }

  # Captured live (0.149.1): thread/status/changed fires `active` when a turn
  # opens and `idle` when it ends — and the idle one lands IMMEDIATELY BEFORE
  # turn/completed on a perfectly healthy turn. So this can never close a turn
  # directly; it only ARMS the reconcile that catches the turn whose close never
  # comes at all (this file's own terminal_notices note records that happening).
  #
  # `systemError` and `notLoaded` are deliberately unmapped: neither means the
  # work is finished, and treating them as idle would close a turn that is merely
  # broken, or one that has not been loaded yet.
  idle:
    in: thread/status/changed
    when: { status.type: idle }
    map: { session_id: threadId }

  compact_start:
    out: thread/compact/start
    send: { threadId: "{session_id}" }

  # These two USED to ride transport: hooks — the api transport carried no
  # equivalent, so it was SOME codex process firing them, but with no attach
  # it was a separate, disconnected PTY spawnRunner still forks, driving its
  # own unrelated conversation. codex's `thread/compacted` notification is
  # its own published schema's replacement for that (marked deprecated in
  # favour of a `contextCompaction` ThreadItem), and confirmed live
  # (codex-cli 0.149.1, via thread/compact/start): compaction is not a
  # dedicated notification at all — it is a THIRD sum-type variant riding
  # the exact same item/started/item/completed stream tool_pre/tool_post
  # already consume, gated on item.type: contextCompaction the same way.
  #
  # The contextCompaction item itself carries only {id, type} — no trigger,
  # no summary — so `trigger:` is dropped rather than mapped to a path that
  # would never resolve (the same call plan_update's own comment already
  # documents for its `explanation` field).
  #
  # THE TRAP: thread/compact/start's response wraps the item pair in its OWN
  # turn/started..turn/completed pair, on the SAME connection, and that
  # turn/completed is turn_stop/turn_failed's wire event too — confirmed
  # live, and confirmed live that NEITHER itemsView nor an empty items list
  # tells it apart from a genuinely interrupted real turn or a real turn
  # that ran a tool and sent no final text (both produce the identical empty
  # shape). turn_stop/turn_failed's own turn_id mapping plus the latch in
  # turn/compaction.go is what keeps a compaction from being misread as an
  # ordinary reply or a failed one.
  compact_pre:
    in: item/started
    when: { item.type: contextCompaction }
    map:
      session_id: "threadId || session_id"
      turn_id:    turnId

  compact_post:
    in: item/completed
    when: { item.type: contextCompaction }
    map:
      session_id: "threadId || session_id"
      turn_id:    turnId

  # STILL ride transport: hooks — the disconnected-PTY gap above is real for
  # these two, and is NOT closed by this pass. Confirmed live (codex-cli
  # 0.149.1, `-c features.collab_agents=true`, a prompt that asks the model
  # to spawn one): codex's real multi-agent mechanism is architecturally
  # nothing like a StartSubagent/StopSubagent pair. What actually happens:
  #
  #   1. The model calls its OWN collabAgentToolCall tool (spawnAgent), an
  #      ORDINARY item/started..completed pair on the PARENT thread — this is
  #      now mapped as a plain tool call (see tool_pre/tool_post/tool_fail's
  #      collabAgentToolCall branch above), and item/completed's
  #      receiverThreadIds[0] names the spawned agent's own new thread id.
  #   2. That child thread runs a COMPLETE, independent turn/started ..
  #      item/* .. turn/completed cycle of its own, pushed over this SAME
  #      connection despite the client never having called thread/start or
  #      thread/resume on it.
  #   3. The model calls collabAgentToolCall(tool: wait) — another ordinary
  #      tool call — whose OWN item/completed.agentsStates[childId] carries
  #      the child's terminal status ("completed") and its result message
  #      ("done"). This is the one place the child's outcome surfaces back
  #      on the parent thread's own stream.
  #   4. The model calls collabAgentToolCall(tool: closeAgent) to tear the
  #      child down; the child's thread/status/changed goes to "notLoaded".
  #
  # subAgentActivity — the OTHER item type the first pass's schema reading
  # guessed this would ride, with its started|interacted|interrupted kinds —
  # NEVER appeared, across two full independent live captures of this exact
  # sequence. It is presumably reserved for codex's OWN internally-spawned
  # subagents (SubAgentSource's bare review|compact|memory_consolidation
  # variants — an auto-review or auto-compaction subagent Crowbar never
  # asked for), not for an explicit model-driven collab tool call. That
  # remains UNCONFIRMED — no live capture of it exists yet.
  #
  # Mapping a real subagent_pre/subagent_post onto this needs Crowbar's own
  # activity ledger to grow a nested-thread model StartSubagent/StopSubagent
  # do not have (a subagent is a whole second thread with its own turn/item
  # stream, not a flat id), AND the mapping grammar needs a way to read
  # agentsStates' status/message keyed by a THREAD ID it cannot know in
  # advance (no name=value selector can address a map keyed by an arbitrary
  # id — only receiverThreadIds[0], the list form, is addressable today).
  # Landing the tool-call visibility above first, leaving this dedicated
  # pair as hooks-transport dead weight until that design exists, is the
  # honest state of things — a broken or unverified nested-subagent mapping
  # would be worse than none.
  subagent_pre:
    transport: hooks
    in: SubagentStart
    map: { session_id: session_id, subagent_id: agent_id, agent_type: agent_type }

  subagent_post:
    transport: hooks
    in: SubagentStop
    map: { session_id: session_id, subagent_id: agent_id, agent_type: agent_type }

  # STILL rides transport: hooks, but investigated and confirmed harmless:
  # HookSessionEnd's own dispatch (turn/ingest.go) is ALREADY a deliberate
  # no-op regardless of which transport delivers it — a session ending is
  # observed authoritatively by the PTY-exit reconcile (every provider) and,
  # for the api transport specifically, by onAPIConnLost (runner/connloss.go)
  # tearing the connection down and reconciling its turn the moment the
  # driver's Events() channel closes. Acting on session_end a second time
  # would close a turn twice.
  #
  # codex's api schema has no dedicated "session is ending, here is why"
  # notification to move this onto. The closest candidate, thread/closed
  # (params: {threadId}, no reason), was tried live against every
  # client-reachable action that could plausibly precede it — including
  # thread/unsubscribe — and never fired. Absent a reachable trigger,
  # mapping it would be exactly the kind of ships-but-never-fires change
  # this report's own methodology exists to catch (see the thread/status/
  # changed correction above), so nothing was added. If a future codex
  # version exposes an explicit "close this thread" request, or thread/
  # closed is later observed to fire from a client-reachable action, that
  # is the wire to map this onto — driven and confirmed live first.
  session_end:
    transport: hooks
    in: SessionEnd
    map: { session_id: session_id, reason: reason }

# No guarded key: --ask-for-approval accepts only on-request/never
# (confirmed via `codex --help`), so there is no "ask about everything" mode
# to offer. A level omitted here is never offered, not clamped.
#
# Neither level drops the sandbox (NOT
# --dangerously-bypass-approvals-and-sandbox) — full-auto only silences the
# escalation prompt. vars feeds the SAME two values to prompt.fresh above.
permission_levels:
  strategy: restart_tui
  levels:
    trusted:
      apply:
        - pass_arg: { arg: "--sandbox", value: "workspace-write" }
        - pass_arg: { arg: "--ask-for-approval", value: "on-request" }
      vars:
        sandbox: workspace-write
        approvalPolicy: on-request
    full-auto:
      apply:
        - pass_arg: { arg: "--sandbox", value: "workspace-write" }
        - pass_arg: { arg: "--ask-for-approval", value: "never" }
      vars:
        sandbox: workspace-write
        approvalPolicy: never

catalog:
  models:   { call: model/list }
  commands: { call: skills/list }
  limits:   { call: account/rateLimits/read }

# at: mcp is unimplemented — nothing in Go calls it. at: context is: a
# RESUME with a real gap to hand over sends the same {context} document
# thread/start's developerInstructions carries on a fresh thread.
#
# items' shape was guessed from ThreadStartParams (unconstrained in the
# schema) and confirmed live: a "message"/role "user" item is what the model
# actually recalls next turn — "developer"/"system" items sat inert.
inject:
  - at: mcp
    call: config/mcpServer/reload
  - at: context
    call: thread/inject_items
    send:
      threadId: "{session_id}"
      items:
        - type: message
          role: user
          content:
            - type: input_text
              text: "{context}"

# --- carried across from v2 unchanged -------------------------------------
# Validated against codex 0.139.0, except mcp_servers.crowbar (0.146.0).
spawn:
  cmd: codex
  interactive_required: true
  forbid_flags: ["exec"]
  # --sandbox/--ask-for-approval are level-scoped (permission_levels above),
  # not here. KNOWN GAP: on-request only escalates when the model steps
  # OUTSIDE the sandbox, so an ordinary in-workspace write never reaches
  # Crowbar's own dial at either level this CLI offers.
  args:
    - "--dangerously-bypass-hook-trust"
session:
  resume: { arg: "resume {id}" }
presentation:
  prompt_submit:
    strategy: restart_tui
    fresh:
      - pass_arg: { positional: "--" }
      - pass_arg: { positional: "{message}" }
    resume:
      - pass_arg: { positional: "--" }
      - pass_arg: { positional: "{message}" }
  # `debug prompt-input` renders model-visible instructions without
  # starting a turn; the native /skills menu may hold more.
  slash_catalog:
    completeness: model_visible
    timeout_ms: 10000
    max_stdout_bytes: 4194304
    max_stderr_bytes: 262144
    max_items: 200
    pipeline:
      adapter: json_text_section
      command: ["debug", "prompt-input"]
      text_path: "[].content[].text"
      start_marker: "<skills_instructions>"
      end_marker: "</skills_instructions>"
      # First colon FOLLOWED BY WHITESPACE — a skill name may itself be
      # plugin-qualified with a colon (`plugin:skill: Desc`).
      item_pattern: '(?m)^- (?P<name>[^\r\n]+?):\s+(?P<description>.*?)(?:\s+\((?:file|orchestrator resource|environment resource|custom resource):[^\r\n]*\))?\r?$'
      item:
        label: "{name}"
        description: "{description}"
        insert_text: "${name} "
        source: "model-visible"
# A SNAPSHOT, not a declared list — measured with `codex debug models`, in
# codex's own priority order. Drifts silently until re-measured.
model:
  available: [gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-5.5, gpt-5.4, gpt-5.4-mini]
  strategy: restart_tui
  apply:
    - pass_arg: { arg: "--model", value: "{model}" }
effort:
  # No "*" fallback, deliberately: an unlisted model must answer with no
  # levels, never another model's.
  available:
    gpt-5.6-sol:   [low, medium, high, xhigh, max, ultra]
    gpt-5.6-terra: [low, medium, high, xhigh, max, ultra]
    gpt-5.6-luna:  [low, medium, high, xhigh, max]
    gpt-5.5:       [low, medium, high, xhigh]
    gpt-5.4:       [low, medium, high, xhigh]
    gpt-5.4-mini:  [low, medium, high, xhigh]
  strategy: restart_tui
  apply:
    - pass_arg: { arg: "-c", value: 'model_reasoning_effort="{effort}"' }
# Crowbar does not own ~/.codex — everything below is a session-layer `-c`
# override. Pointing CODEX_HOME at a Crowbar-owned dir (what this used to
# do) made cleanup destroy the user's own threads.
config_injection:
  - pass_arg: { arg: "-c", value: 'check_for_update_on_startup=false' }
  # ASK for reasoning summaries. Codex emits NONE by default — measured on
  # 0.149.1 by running the identical reasoning-heavy prompt twice: zero
  # item/reasoning/* frames with the default, a full stream with this set. So
  # without this line the reasoning_delta event above is inert in production and
  # a reasoning model's long silences stay unexplained, which is exactly the
  # dead air it was added to fix. Caught only by driving the real app; every
  # unit test passed either way.
  - pass_arg: { arg: "-c", value: 'model_reasoning_summary=detailed' }
  # TUI-native modals, suppressed rather than answered — no hook fires for
  # these. Only the three unambiguous ones: migration-prompt keys contain
  # dots, which a TOML dotted-key override would parse as nested tables. An
  # unknown `-c` key is inert, so a wrong one here can only leave a modal up.
  - pass_arg: { arg: "-c", value: 'notice.hide_rate_limit_model_nudge=true' }
  - pass_arg: { arg: "-c", value: 'notice.hide_full_access_warning=true' }
  - pass_arg: { arg: "-c", value: 'notice.hide_world_writable_warning=true' }
  # workspace-write denies network, and a unix-socket connect IS network on
  # macOS — grants network only, not the filesystem.
  - pass_arg: { arg: "-c", value: 'sandbox_workspace_write.network_access=true' }
  - pass_arg:
      arg: "-c"
      value: 'hooks.SessionStart=[{hooks=[{type="command",command="{crowbar_hook} hook session_start --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.UserPromptSubmit=[{hooks=[{type="command",command="{crowbar_hook} hook user_prompt --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.Stop=[{hooks=[{type="command",command="{crowbar_hook} hook turn_stop --segment {segid} --provider {provider} {scope_flags}"}]}]'
  # codex exposes no Notification event. Absent capability, absent UI.
  - pass_arg:
      arg: "-c"
      value: 'hooks.PreToolUse=[{hooks=[{type="command",command="{crowbar_hook} hook tool_pre --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.PostToolUse=[{hooks=[{type="command",command="{crowbar_hook} hook tool_post --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.SubagentStart=[{hooks=[{type="command",command="{crowbar_hook} hook subagent_pre --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.SubagentStop=[{hooks=[{type="command",command="{crowbar_hook} hook subagent_post --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.PermissionRequest=[{hooks=[{type="command",command="{crowbar_hook} hook permission --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.PreCompact=[{hooks=[{type="command",command="{crowbar_hook} hook compact_pre --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.PostCompact=[{hooks=[{type="command",command="{crowbar_hook} hook compact_post --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.SessionEnd=[{hooks=[{type="command",command="{crowbar_hook} hook session_end --segment {segid} --provider {provider} {scope_flags}"}]}]'
mcp_injection:
  - pass_arg: { arg: "-c", value: 'mcp_servers.crowbar.command="{crowbar}"' }
  - pass_arg:
      arg: "-c"
      value: 'mcp_servers.crowbar.args=["mcp","--segment","{segid}","--token","{runner_token}","--project","{project_id}","--workspace","{workspace_id}","--repo","{repo_id}"]'
  # codex starts an MCP server with a SCRUBBED environment — CROWBAR_HOME
  # does not survive it, and that variable is the only thing selecting which
  # daemon socket a `crowbar` subprocess dials. FORWARDED, not a literal: an
  # unset CROWBAR_HOME must stay unset in the child.
  - pass_arg: { arg: "-c", value: 'mcp_servers.crowbar.env_vars=["CROWBAR_HOME"]' }
  # Without this codex stops on every Crowbar tool call and waits for a
  # human — the shell's own approval policy never covers MCP calls, which
  # default to prompting regardless of level. SERVER-WIDE by owner decision
  # (2026-07-29): the per-tool key it replaced stalled on any tool that
  # forgot a line. `approve` is the one mode verified live to suppress it.
  - pass_arg:
      arg: "-c"
      value: 'mcp_servers.crowbar.default_tools_approval_mode="approve"'
# No --append-system-prompt equivalent, and the positional [PROMPT] IS the
# user's first message — developer_instructions is the additive channel
# that leaves the composer empty. NOT model_instructions_file, which
# REPLACES codex's system prompt.
context_inject:
  - pass_arg: { arg: "-c", value: "developer_instructions={context}" }
# NO resume_context_inject, deliberately: a resumed codex session is
# entirely api-transport-owned, and the redundant hooks-only PTY never
# resumes the same thread — there is no CLI argv left to ride. The api
# connection delivers {context} instead, via inject: at: context above.
#
# UNKINDED, unlike claude's pair: "Press enter to continue" is generic
# confirmation text, so a match only proves the CLI is blocked, not why.
terminal_prompts:
  - needle: "Press enter to continue"
  # A second, distinct modal — the two needles share a prefix and diverge,
  # so neither substring-matches the other.
  - needle: "Press enter to confirm or esc to go back"
# Captured live (0.146.0): a turn can end with no Stop/SessionEnd/exit, so
# the runner-exit reconcile never fires and the turn stays open indefinitely
# — `ends_turn: true` is the fix. Only the first line is declared; URLs and
# reset time are account-specific and captured verbatim off the screen.
#
# NO idle needle: codex's composer placeholder rotates between sessions and
# its busy indicator was never measured.
terminal_notices:
  - kind: usage_limit
    needle: "You've hit your usage limit"
    ends_turn: true
