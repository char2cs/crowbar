# Codex — v3, event-centric, MIXED TRANSPORT: the app-server API carries the
# interactive core (turns, streaming, answerable permissions, telemetry,
# interrupt, compact). See the design spec's "Corrections" section for how the
# api transport's wire framing (WebSocket, not raw NDJSON) was confirmed live
# against codex-cli 0.146.0.
#
# `attach` is declared WITHOUT `hotswap` — codex hands its live turn over,
# never shares it. Confirmed live against codex-cli 0.149.1 that the
# app-server's own live-attach mechanism (`codex resume {id} --remote
# unix://socket`, connecting a SECOND client to the SAME app-server process)
# does not work: it fails outright with "no rollout found for thread id" on a
# fresh thread (the rollout is not flushed to disk until a turn completes),
# and — separately — codex enforces one writer per thread (a
# thread-writer-lock file, confirmed on disk), so even once a rollout exists
# a second live client is the wrong shape regardless. There is no live
# hotswap here, and none is declared.
#
# What IS confirmed live: a bare, ORDINARY `codex resume {id}` (no --remote,
# no shared socket, run only once at least one turn has completed and the
# rollout is flushed) is codex's own standard resume feature and needs
# nothing api-transport-specific at all. So `attach` is idle-only sequential
# handoff, never concurrent access — see runner/attach.go's SwitchToTerminal:
# the api connection is torn down FIRST, then this is forked as a plain
# hooks-transport CLI (carrying the same MCPInject/ConfigInjection every
# hooks-attached CLI gets, so it reports back to Crowbar's ledger exactly like
# claude's always-live PTY does), and switching back re-establishes the api
# connection over the SAME session via `resume:` above.
#
# Replaces the standalone experimental/codex-api.yaml, deleted by this merge —
# its map:/send:/reply: paths carry over unchanged, replayed against the same
# recorded fixtures (see fixture_test.go).
id: codex
display_name: Codex
icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/></svg>'

runtime:
  transport: api
  api:
    protocol: jsonrpc2
    serve:  [codex, app-server, --listen, "unix://{socket}"]
    # Idle-only, sequential handoff — see this file's own header comment.
    # Never rendered at spawn (see applyAPITransport's Hotswap gate); only
    # SwitchToTerminal (runner/attach.go) forks this, and only once idle.
    attach: [codex, resume, "{session_id}"]
    handshake: { call: initialize }
  hooks:
    format: json
    delivery: http
    require_payload_fields: [transcript_path]
  spawn:
    cmd: codex

events:
  # Two live shapes share this one canonical event: the api transport's own
  # thread/started (thread.id), and the flat session_id/transcript_path a real
  # `crowbar hook session_start` delivery still carries — codex's own spawned
  # config.toml wires that hook unconditionally (see the SessionStart entry
  # below), so it fires on every codex process, api-transport or attached,
  # not only while native-attached. thread.id is tried first; the bare
  # session_id is the hooks-delivered fallback.
  session_start:
    in: thread/started
    map: { session_id: "thread.id || session_id" }

  # item/started is a SUM TYPE: one wire event serves several canonical events,
  # selected by item.type.
  #
  # Same dual-shape hazard as session_start (see its comment above): codex's
  # own spawn config unconditionally wires hooks.UserPromptSubmit/Stop/
  # PreToolUse/PostToolUse too, delivering the OLD flat payload shape
  # (session_id/prompt/last_assistant_message/tool_use_id/tool_name) over the
  # SAME IngestHook path these api-shape mappings feed. tool_id in particular
  # is load-bearing, not cosmetic: an unresolved tool_id makes toolID() mint a
  # fresh random fallback id per call (observation.go), so tool_pre and
  # tool_post never match the SAME id and OpenWork reports the chat as
  # perpetually mid-turn — confirmed live and by
  # TestUsecase_OpenWork_ReportsAToolCallTheProviderNeverClosed.
  user_prompt:
    in: item/started
    when: { item.type: userMessage }
    map:
      session_id: "threadId || session_id"
      message:    "item.content[type=text].text || prompt"

  # The final message is an ITEM IN A LIST, not turn.lastAgentMessage — that
  # field does not exist. turn.items holds {type, id, text, phase}; the answer
  # is the agentMessage.
  turn_stop:
    in: turn/completed
    map:
      session_id: "threadId || session_id"
      message:    "turn.items[type=agentMessage].text || last_assistant_message"

  tool_pre:
    in: item/started
    when: { item.type: commandExecution || fileChange || mcpToolCall }
    map:
      session_id: "threadId || session_id"
      tool_id:    "item.id || tool_use_id"
      tool_name:  "item.type || tool_name"
      tool_input: item

  tool_post:
    in: item/completed
    when: { item.type: commandExecution || fileChange || mcpToolCall }
    map:
      session_id:  "threadId || session_id"
      tool_id:     "item.id || tool_use_id"
      tool_name:   "item.type || tool_name"
      tool_result: "item.content || tool_response"

  # No index: codex's delta carries {delta, itemId, threadId, turnId} and
  # nothing more. Deltas arrive on one ordered stream, so arrival order is the
  # order.
  message_delta:
    in: item/agentMessage/delta
    map:
      session_id: threadId
      message_id: itemId
      text:       delta
      turn_id:    turnId

  # tokenUsage nests under total/ — NOT tokenUsage.inputTokens directly.
  telemetry:
    in: thread/tokenUsage/updated
    map:
      session_id:              threadId
      input_tokens:            tokenUsage.total.inputTokens
      output_tokens:           tokenUsage.total.outputTokens
      context.used_tokens:     tokenUsage.total.totalTokens
      context.capacity_tokens: tokenUsage.modelContextWindow

  # ANSWERABLE, unlike the old hooks-only observation: the api transport
  # carries a real response channel, so a decision made in Crowbar's chat now
  # reaches codex directly instead of the human answering in the terminal.
  permission:
    ask: item/permissions/requestApproval
    timeout_seconds: 270
    map:
      tool_name:  tool
      tool_input: params
    reply:
      allow: '{"decision":"approved"}'
      deny:  '{"decision":"denied","message":{reason_json}}'
    risk:
      standard: [shell, apply_patch]
      internal: ["mcp__crowbar__*"]
      # anything else is sensitive by default.

  elicitation:
    ask: mcpServer/elicitation/request
    timeout_seconds: 270
    map:
      message: message
      schema:  requestedSchema
    reply:
      accept:  '{"action":"accept","content":{content_json}}'
      decline: '{"action":"decline"}'
      cancel:  '{"action":"cancel"}'

  # Sending a message needs a session to already exist, and codex has no single
  # call that both starts one and acts on it: `thread/start` (a fresh
  # conversation) and `thread/resume` (an existing one this connection has
  # never itself loaded — the ordinary case right after a Crowbar restart,
  # where the runner already remembers a session id from before) are two
  # DIFFERENT calls, each producing the {session_id} `action` then sends to.
  # `input` is an array of typed content blocks, never a bare string — the
  # ONE reason `send:` needs to be a tree here instead of the flat
  # {field: "{value}"} shape interrupt/compact_start still use below.
  #
  # sandbox/approvalPolicy are fixed literals, mirroring codex.yaml's own
  # hooks-transport `spawn.args` (`--sandbox workspace-write --ask-for-approval
  # on-request`) — the PTY-launched settings this connection replaces. Update
  # both together if either ever changes.
  prompt:
    fresh:
      - call: thread/start
        send:
          cwd:                   "{cwd}"
          sandbox:               workspace-write
          approvalPolicy:        on-request
          # The api-transport equivalent of context_inject's -c
          # developer_instructions={context} below — same document, same
          # {context} value (spawnRunner's tctx.Context), the CLI's config
          # override and this thread/start param confirmed live as the two
          # ways codex accepts it (see ThreadStartParams in codex-cli
          # 0.149.1's `codex app-server generate-json-schema`). Without this a
          # thread/start-ed codex has no handoff at all: a chat switched to
          # codex answers its first message with zero memory of what came
          # before, even though the switch's own spawn assembled it.
          developerInstructions: "{context}"
        capture:
          session_id: thread.id
    resume:
      - call: thread/resume
        send:
          threadId: "{session_id}"
          cwd:      "{cwd}"
    action:
      - call: turn/start
        send:
          threadId: "{session_id}"
          input:
            - type: text
              text: "{text}"
        # turn.id is the ONE thing interrupt below needs that thread/start never
        # has: a cancel scoped to "this turn", not "this thread". Captured here,
        # remembered by the driver across calls (same mechanism as session_id),
        # so interrupt's own send: below can reference it with nothing else
        # threading it through.
        capture:
          turn_id: turn.id

  # Confirmed live: turn/interrupt with only threadId fails outright ("missing
  # field turnId") — a codex cancel is scoped to the turn, not the thread. With
  # both fields it succeeds, the thread moves to idle, and the cancelled turn
  # surfaces as an ordinary turn/completed (status "interrupted") — already
  # covered by turn_stop's existing in: turn/completed mapping above, so
  # nothing else has to change to close it out. Also confirmed: the connection
  # survives a successful interrupt and accepts a new turn/start immediately —
  # this is a turn-scoped cancel, not a teardown.
  interrupt:
    out: turn/interrupt
    send: { threadId: "{session_id}", turnId: "{turn_id}" }

  compact_start:
    out: thread/compact/start
    send: { threadId: "{session_id}" }

  # The five events the api transport does not carry. Declared transport:
  # hooks because SOME codex process still fires them — but with no attach (see
  # runtime.api's own comment), that process is a SEPARATE, disconnected PTY
  # spawnRunner still forks (nothing today makes "no attach" mean "no PTY" —
  # design spec capability 2's third state), driving its own unrelated
  # conversation. Its subagent/compact/session_end events do not describe the
  # thread `prompt` is actually driving. Known, tracked as follow-up work
  # (implement the no-PTY-at-all path), not silently papered over.
  subagent_pre:
    transport: hooks
    in: SubagentStart
    map: { session_id: session_id, subagent_id: agent_id, agent_type: agent_type }

  subagent_post:
    transport: hooks
    in: SubagentStop
    map: { session_id: session_id, subagent_id: agent_id, agent_type: agent_type }

  compact_pre:
    transport: hooks
    in: PreCompact
    map: { session_id: session_id, trigger: trigger }

  compact_post:
    transport: hooks
    in: PostCompact
    map: { session_id: session_id, trigger: trigger }

  session_end:
    transport: hooks
    in: SessionEnd
    map: { session_id: session_id, reason: reason }

catalog:
  models:   { call: model/list }
  commands: { call: skills/list }
  limits:   { call: account/rateLimits/read }

# at: mcp is a SEPARATE known gap, still unimplemented — nothing in Go calls
# it. at: context is not: apiconn.go's applyAPITransport (runner package)
# calls this the moment a RESUME establishes a session that had a real gap to
# hand over, sending the exact same {context} document thread/start's own
# developerInstructions carries on a fresh thread — no CLI turn, no
# positional prompt, and (unlike the pointer this replaces) no dependence on
# the model choosing to fetch anything.
#
# items is "Raw Responses API items" (ThreadInjectItemsParams's own schema
# comment; codex-cli 0.149.1's generate-json-schema declares the array element
# type as unconstrained, so nothing validates this shape — it was guessed,
# then confirmed live against a real thread). A "message"/role "user" item is
# what a live probe showed the model actually recalling on its very next turn
# (role "developer" and "system" items, sent the same way, sat inert) — the
# SAME role claude's own resume_context_inject uses for the identical
# content, delivered over a channel that fires no item/started at all, so
# there is nothing here for WasInjected to ever need to suppress.
inject:
  - at: mcp
    call: config/mcpServer/reload
  - at: context
    call: thread/inject_items
    send:
      threadId: "{session_id}"
      items:
        - type: message
          role: user
          content:
            - type: input_text
              text: "{context}"

# --- carried across from v2 unchanged -------------------------------------
# Validated against codex 0.139.0, except the mcp_servers.crowbar entries below,
# which were first exercised by a live tool call on 0.146.0.
spawn:
  cmd: codex
  interactive_required: true
  forbid_flags: ["exec"]
  # codex has no single "auto" switch: workspace-write + on-request is its
  # equivalent — it works inside the workspace and escalates only to step outside.
  # NOT --dangerously-bypass-approvals-and-sandbox, which drops the sandbox.
  #
  # KNOWN GAP, not fixable here: 0.149.1's --ask-for-approval accepts only
  # on-request/never (confirmed via `codex --help`; no `default`/`untrusted`
  # exists at this flag). on-request only escalates to a PermissionRequest
  # hook when the model steps outside the sandbox, so Crowbar's own
  # PermissionLevel — guarded included — never sees an ordinary in-workspace
  # write; the sandbox silently allows it first. Unlike Claude, there is no
  # broader-coverage value to switch to on this CLI today.
  args:
    - "--dangerously-bypass-hook-trust"
    - "--sandbox"
    - "workspace-write"
    - "--ask-for-approval"
    - "on-request"
session:
  resume: { arg: "resume {id}" }
presentation:
  prompt_submit:
    strategy: restart_tui
    fresh:
      - pass_arg: { positional: "--" }
      - pass_arg: { positional: "{message}" }
    resume:
      - pass_arg: { positional: "--" }
      - pass_arg: { positional: "{message}" }
  # `debug prompt-input` renders the instructions codex would make model-visible,
  # without starting a model turn. Its native /skills menu may hold more, hence
  # model_visible rather than complete.
  slash_catalog:
    completeness: model_visible
    timeout_ms: 10000
    max_stdout_bytes: 4194304
    max_stderr_bytes: 262144
    max_items: 200
    pipeline:
      adapter: json_text_section
      command: ["debug", "prompt-input"]
      text_path: "[].content[].text"
      start_marker: "<skills_instructions>"
      end_marker: "</skills_instructions>"
      # A skill name may itself be plugin-qualified with colons, so the field
      # delimiter is the first colon FOLLOWED BY WHITESPACE (`plugin:skill: Desc`).
      item_pattern: '(?m)^- (?P<name>[^\r\n]+?):\s+(?P<description>.*?)(?:\s+\((?:file|orchestrator resource|environment resource|custom resource):[^\r\n]*\))?\r?$'
      item:
        label: "{name}"
        description: "{description}"
        insert_text: "${name} "
        source: "model-visible"
# A SNAPSHOT OF A LIVE ENUMERATION, unlike claude's declared list: measured with
# `codex debug models` (account metadata, not a model turn), in codex's own priority
# order, omitting codex-auto-review which reports visibility: hide. It still drifts —
# a model added upstream changes nothing here until somebody re-runs the command.
model:
  available: [gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-5.5, gpt-5.4, gpt-5.4-mini]
  strategy: restart_tui
  apply:
    - pass_arg: { arg: "--model", value: "{model}" }
effort:
  # THE CASE THE PER-MODEL MAP EXISTS FOR — the levels genuinely vary. There is
  # deliberately NO "*" fallback: an unlisted model must answer with no levels
  # rather than with another model's.
  available:
    gpt-5.6-sol:   [low, medium, high, xhigh, max, ultra]
    gpt-5.6-terra: [low, medium, high, xhigh, max, ultra]
    gpt-5.6-luna:  [low, medium, high, xhigh, max]
    gpt-5.5:       [low, medium, high, xhigh]
    gpt-5.4:       [low, medium, high, xhigh]
    gpt-5.4-mini:  [low, medium, high, xhigh]
  strategy: restart_tui
  apply:
    # codex has no --effort; `-c key=value` is its config-override channel.
    - pass_arg: { arg: "-c", value: 'model_reasoning_effort="{effort}"' }
# THE LAW THIS DESCRIPTOR IS BUILT ON: Crowbar does not own ~/.codex. Everything is
# a session-layer `-c` override, so nothing is written and the user's own skills, MCP
# servers, memories and hooks all stay live.
#
# Pointing CODEX_HOME at a Crowbar-owned directory — what this used to do — made
# Crowbar the custodian of codex's SESSIONS, so cleaning up the directory destroyed
# the user's thread and switching back died with "no rollout found for thread id".
config_injection:
  # codex prompts to self-update on startup, which eats the pane's first keystrokes.
  - pass_arg: { arg: "-c", value: 'check_for_update_on_startup=false' }
  # TUI-NATIVE modals, suppressed rather than answered: the TUI draws these itself,
  # no hook fires, and nothing Crowbar can send reaches them.
  #
  # Only the three unambiguous ones. `fast_default_opt_out` is a SERVICE-TIER choice
  # the user owns, and the migration prompts are left alone because their key
  # spelling contains dots, which a TOML dotted-key override parses as nested tables.
  #
  # An unknown `-c` key is inert — `--strict-config` validates config.toml only and
  # accepts `-c notice.total_nonsense_key=true` — so a wrong key here can break
  # nothing, it can only leave a modal showing.
  - pass_arg: { arg: "-c", value: 'notice.hide_rate_limit_model_nudge=true' }
  - pass_arg: { arg: "-c", value: 'notice.hide_full_access_warning=true' }
  - pass_arg: { arg: "-c", value: 'notice.hide_world_writable_warning=true' }
  # workspace-write DENIES NETWORK, and on macOS a unix-socket connect IS network, so
  # a sandboxed codex cannot reach the daemon at all. Found through the shell titling
  # command, which died every time on `connect: operation not permitted`; it hid
  # because codex spawns HOOKS outside the sandbox, so everything else looked healthy.
  #
  # This grants network, not the filesystem. claude runs with no kernel sandbox at
  # all, so even after this codex remains the more confined of the two.
  - pass_arg: { arg: "-c", value: 'sandbox_workspace_write.network_access=true' }
  # The hooks Crowbar listens on, and the only thing it injects. The user's own
  # ~/.codex/hooks.json still fires alongside these.
  - pass_arg:
      arg: "-c"
      value: 'hooks.SessionStart=[{hooks=[{type="command",command="{crowbar_hook} hook session_start --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.UserPromptSubmit=[{hooks=[{type="command",command="{crowbar_hook} hook user_prompt --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.Stop=[{hooks=[{type="command",command="{crowbar_hook} hook turn_stop --segment {segid} --provider {provider} {scope_flags}"}]}]'
  # codex 0.146.0 fires these event names — extracted from the binary's hook schema —
  # but their PAYLOAD FIELDS have not been captured live: the account hit its usage
  # limit mid-probe. Every mapping degrades to empty rather than to wrong if a field
  # sits elsewhere. Re-capture and confirm.
  #
  # codex exposes no Notification event. Absent capability, absent UI.
  - pass_arg:
      arg: "-c"
      value: 'hooks.PreToolUse=[{hooks=[{type="command",command="{crowbar_hook} hook tool_pre --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.PostToolUse=[{hooks=[{type="command",command="{crowbar_hook} hook tool_post --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.SubagentStart=[{hooks=[{type="command",command="{crowbar_hook} hook subagent_pre --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.SubagentStop=[{hooks=[{type="command",command="{crowbar_hook} hook subagent_post --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.PermissionRequest=[{hooks=[{type="command",command="{crowbar_hook} hook permission --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.PreCompact=[{hooks=[{type="command",command="{crowbar_hook} hook compact_pre --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.PostCompact=[{hooks=[{type="command",command="{crowbar_hook} hook compact_post --segment {segid} --provider {provider} {scope_flags}"}]}]'
  - pass_arg:
      arg: "-c"
      value: 'hooks.SessionEnd=[{hooks=[{type="command",command="{crowbar_hook} hook session_end --segment {segid} --provider {provider} {scope_flags}"}]}]'
mcp_injection:
  - pass_arg: { arg: "-c", value: 'mcp_servers.crowbar.command="{crowbar}"' }
  - pass_arg:
      arg: "-c"
      value: 'mcp_servers.crowbar.args=["mcp","--segment","{segid}","--token","{runner_token}","--project","{project_id}","--workspace","{workspace_id}","--repo","{repo_id}"]'
  # codex starts an MCP server with a SCRUBBED environment — a fixed allowlist and
  # nothing else — and CROWBAR_HOME does not survive it. That variable is the ONLY
  # thing selecting which daemon socket a `crowbar` subprocess dials, so without this
  # a codex relay walks past the daemon that spawned it and dials the default one:
  # off the default home the tool surface is entirely DEAD (the runner token is HMAC'd
  # with a per-process secret, so it cannot validate there), and a runner id and
  # bearer token cross a boundary they were never scoped for.
  #
  # FORWARDED, not injected with a literal: an unset CROWBAR_HOME must stay unset in
  # the child, because unset is what selects the default home.
  - pass_arg: { arg: "-c", value: 'mcp_servers.crowbar.env_vars=["CROWBAR_HOME"]' }
  # Without this codex STOPS on every Crowbar tool call and waits for a human —
  # `on-request` is its approval policy for the SHELL, and MCP calls are gated
  # separately and default to prompting.
  #
  # SERVER-WIDE by owner decision (2026-07-29), not a workaround: an agent that acts
  # without a per-call modal is the point of this surface. It is also the only form
  # that does not rot — the per-tool key it replaced needed a line per tool, and an
  # omitted line stalls that tool on a modal nobody in a Crowbar pane can answer.
  #
  # `approve` is the one mode verified live to suppress it. `auto` is deliberately
  # unused: 0.146.0 documents nothing about it, and a mode nobody can describe is not
  # one to grant a write with.
  - pass_arg:
      arg: "-c"
      value: 'mcp_servers.crowbar.default_tools_approval_mode="approve"'
# codex ships no --append-system-prompt, and its positional [PROMPT] IS the user's
# first message — passing the handoff there made codex answer it on sight.
# developer_instructions is the documented additive channel and leaves the composer
# empty. NOT model_instructions_file, which REPLACES codex's built-in system prompt.
context_inject:
  - pass_arg: { arg: "-c", value: "developer_instructions={context}" }
# NO resume_context_inject, deliberately: a RESUMED codex session is entirely
# api-transport-owned (apiOwnsResume, prompts.go) — the redundant hooks-only
# PTY spawnRunner still forks alongside it never resumes the same thread and
# is withheld from both the native resume id and any positional prompt, so
# there is no CLI argv left for this to ride at all. The api connection's own
# thread/resume can't carry {context} either (see the inject: at: context
# comment below) — one used to hand a POINTER in here instead, betting the
# model would call get_chat_log for the rest; not reliable enough to keep
# (claude.yaml's own resume_context_inject has the fuller account of why that
# bet was dropped there too, on a hooks-transport channel that DOES still
# exist for it). codex's api connection delivers the same document instead,
# out of band, via inject: at: context below.
# Blocking modals no hook reports — see claude.yaml's terminal_prompts. codex asks
# about trust before it reports anything, so a chat behind that dialog renders as a
# dead pane.
#
# UNKINDED, unlike claude's pair, and that is honest rather than an oversight:
# NEITHER line says anything about trust. "Press enter to continue" is what codex
# would print for any confirmation, so all this can truthfully report is THAT the CLI
# is blocked. A needle gets a kind when a specific one has been captured, never
# before.
terminal_prompts:
  - needle: "Press enter to continue"
  # A SECOND modal, and a different sentence: the needle above does not match it.
  # Reduced, they share a prefix and diverge —  `pressentertocontinue` against
  # `pressentertoconfirmoresctogoback` — so the substring search finds nothing.
  - needle: "Press enter to confirm or esc to go back"
# Messages codex paints INSTEAD of finishing a turn: nobody is being asked anything,
# the attempt is simply over. Captured live from 0.146.0 — a prompt was accepted,
# UserPromptSubmit fired, the turn opened, and codex painted this and sat there. No
# Stop, no SessionEnd, no exit, so the runner-exit reconcile never ran either; the
# turn stayed open for 44 minutes and closed only because a human switched provider.
#
# `ends_turn: true` is the whole claim: the banner is painted BECAUSE the attempt
# ended, so finding it on a screen that has not moved for the quiet period is
# positive evidence the CLI is not working. Only the FIRST LINE is declared — the
# URLs and reset time are account- and clock-specific, and the capture rule reads
# them off the screen into the chat verbatim.
#
# NOT an idle needle, and none is declared: codex's composer placeholder ROTATES
# between sessions. Its BUSY indicator was never measured either — the account was
# rate-limited throughout — and nothing in the detector depends on recognising one.
terminal_notices:
  - kind: usage_limit
    needle: "You've hit your usage limit"
    ends_turn: true

