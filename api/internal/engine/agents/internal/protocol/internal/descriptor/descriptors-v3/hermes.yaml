runtime:
  transport: api
  api:
    protocol: jsonrpc2
    delivery: websocket
    format: jsonrpc_text
    connect: [hermes, gateway, attach, --json, --recover]
    connect_map: { url: url, protocols: protocols }
    reconnect: { max: 5, backoff_ms: 500 }
    # Without server_requests the gateway withdraws approvals instead of sending them.
    handshake: { call: client.capabilities, params: { server_requests: true } }
  spawn:
    cmd: hermes

# The wire has no turn.* events, no failure flag on tool.complete, no typed todo item,
# and compaction (status.update) has no end frame to pair with.
not_emitted: [notification, idle, plan_step, plan_update, tool_fail, tool_output_delta, subagent_result, compact_pre, compact_post, diff_update, terminal_input, session_end]

surfaces:
  chat: { channel: api, start_here: true }

events:
  # No session-scoped frame was seen on create; session.info is its contract-only announcement.
  session_start:
    required: [session_id]
    api:
      in: event
      when: { type: session.info }
      unverified: true
      map: { session_id: session_id, model: payload.model }

  # message.start carries text only for automation turns; ordinary prompts arrive empty.
  user_prompt:
    required: [session_id]
    api:
      in: event
      when: { type: message.start }
      unverified: true
      map: { session_id: session_id, message: payload.text, turn_id: payload.turn_id }

  # turn_failed is offered first (sorted names); any other status closes here.
  turn_stop:
    required: [session_id, message]
    status_map: { complete: completed, interrupted: interrupted }
    api:
      in: event
      when: { type: message.complete }
      unverified: true
      map: { session_id: session_id, message: payload.text, turn_status: payload.status }

  turn_failed:
    required: [session_id, reason]
    api:
      in: event
      when: { type: message.complete, payload.status: error }
      unverified: true
      map:
        session_id:   session_id
        reason:       { first_present: [payload.error, payload.failure_reason, payload.status] }
        detail:       { first_present: [payload.failure_reason, payload.error] }
        failure_kind: payload.error_surface.code

  warning:
    api:
      in: event
      when: { type: { any_of: [error, notice] } }
      unverified: true
      map: { session_id: session_id, message: payload.message }

  message_delta:
    surfaces: [chat]
    required: [session_id, message_id, text]
    api:
      in: event
      when: { type: message.delta }
      unverified: true
      map:
        session_id: session_id
        message_id: { first_present: [{ join: [payload.turn_id, payload.segment] }, session_id] }
        text:       payload.text
        turn_id:    payload.turn_id

  # Interim commentary only: the final text rides turn_stop.
  message_complete:
    required: [session_id, message_id, text]
    api:
      in: event
      when: { type: message.interim }
      unverified: true
      map:
        session_id: session_id
        message_id: { join: [payload.turn_id, payload.segment] }
        text:       payload.text
        turn_id:    payload.turn_id

  reasoning_delta:
    surfaces: [chat]
    required: [session_id, text]
    api:
      in: event
      when: { type: reasoning.delta }
      unverified: true
      map: { session_id: session_id, text: payload.text }

  tool_pre:
    required: [session_id, tool_id, tool_name]
    api:
      in: event
      when: { type: tool.start }
      unverified: true
      map:
        session_id:  session_id
        tool_id:     payload.tool_id
        tool_name:   payload.name
        tool_target: { first_present: [payload.context, payload.preview] }
        tool_input:  payload.args

  tool_post:
    required: [session_id, tool_id, tool_name]
    api:
      in: event
      when: { type: tool.complete }
      unverified: true
      map:
        session_id:  session_id
        tool_id:     payload.tool_id
        tool_name:   payload.name
        tool_title:  payload.summary
        tool_result: { first_present: [payload.result_text, payload.result] }
        tool_output: payload.result_text
    patch: { unified: payload.inline_diff }

  subagent_pre:
    required: [session_id]
    api:
      in: event
      when: { type: subagent.start }
      unverified: true
      map: { session_id: session_id, scope_id: payload.subagent_id, title: payload.goal }

  subagent_post:
    required: [session_id]
    status_map: { completed: done, failed: failed, error: failed, timeout: failed, interrupted: interrupted }
    api:
      in: event
      when: { type: subagent.complete }
      unverified: true
      map:
        session_id:      session_id
        scope_id:        payload.subagent_id
        title:           payload.goal
        status:          payload.status
        result:          payload.summary
        usage.tool_uses: payload.tool_count

  telemetry:
    api:
      in: event
      when: { type: session.usage }
      unverified: true
      map:
        session_id:              session_id
        input_tokens:            payload.usage.input
        output_tokens:           payload.usage.output
        context.used_tokens:     payload.usage.context_used
        context.capacity_tokens: payload.usage.context_max
        context.used_percent:    payload.usage.context_percent
        cost.total_usd:          payload.usage.cost_usd
        model.id:                payload.usage.model

  # approval answers {choice}; clarify answers {answers} keyed by its own question ids.
  permission:
    timeout_seconds: 86340
    api:
      ask: [approval, clarify]
      unverified: true
      map:
        session_id:  session_id
        prompt_id:   request_id
        message:     description
        tool_name:   tool_name
        tool_target: command
        suggestions: choices
        suggestion_label.session: "Allow for the rest of this session"
        suggestion_label.always:  "Always allow this"
        questions:        questions
        question_id:      id
        question_text:    question
        question_choices: choices
        question_multi:   multi_select
    reply:
      allow:      '{"choice":"once"}'
      deny:       '{"choice":"deny"}'
      suggestion: '{"choice":{suggestion_json}}'
      answer:     '{"answers":{answers_json}}'

  # Masked one-string prompts: only a decline is expressible, as an empty value.
  elicitation:
    timeout_seconds: 86340
    api:
      ask: [sudo, secret, vault.unlock_prompt, vault.code, vault.save_login]
      unverified: true
      map:
        session_id: session_id
        message:    { first_present: [prompt, command, display_name, hint, site] }
    reply:
      decline: '{"value":""}'
      cancel:  '{"value":""}'

  prompt:
    fresh:
      - call: session.create
        send: { source: tui, cwd: "{cwd}" }
        capture: { session_id: session_id, execution_generation: execution_generation }
    resume:
      - call: session.resume
        send: { session_id: "{session_id}", omit_messages: true }
        capture: { execution_generation: execution_generation }
    action:
      - call: prompt.submit
        send: { session_id: "{session_id}", text: "{text}" }
        capture: { execution_generation: execution_generation }

  # interrupt is fenced on execution_generation, a number captured from every admission receipt.
  interrupt:
    out: session.interrupt
    send: { session_id: "{session_id}", execution_generation: "{execution_generation}" }

spawn:
  cmd: hermes
  interactive_required: true
