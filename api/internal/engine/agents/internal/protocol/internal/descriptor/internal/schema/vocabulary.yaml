# Crowbar's canonical conversation vocabulary.
#
# CLOSED: a provider descriptor maps INTO these names and cannot add to them. Adding an
# entry here is a Crowbar capability change and needs Go on the consuming side; adding
# a PROVIDER does not, which is the whole point of moving this out of spec/hooks.go.
#
# direction
#   in   — they tell us. `in:` names the wire event; `map:` pulls canonical fields out.
#   out  — we tell them. `out:` names the call; `send:` builds the payload.
#   ask  — they block on our reply. Both halves plus a correlation id.
#
# required  — the descriptor MUST map these, or it fails to load.
# optional  — it may. A name ending in `.*` is a prefix FAMILY: any field under it is
#             allowed, because its keys are provider vocabulary Crowbar must not learn
#             (see permission.suggestion_label.*).
# extras    — sibling keys on the event that are structured rather than field maps.
#             Their shape is validated by the event's own rule, not by this table.
# replies   — for `ask` events, the decision names the reply template may define.
version: 3

events:
  session_start:
    direction: in
    required: [session_id]
    optional: [model]

  user_prompt:
    direction: in
    required: []
    optional: [session_id, message]

  turn_stop:
    direction: in
    required: [message]
    # turn_id is OPTIONAL and unused by Go's own field-by-field reads — it
    # exists so a provider whose turn-closing wire event is a sum type (codex:
    # turn/completed also wraps a compact_start round trip, with no other
    # field distinguishing the two — confirmed live, see codex.yaml's
    # compact_pre) can correlate against a turn armed by a DIFFERENT
    # canonical event and be skipped instead of misread as an ordinary reply.
    optional: [session_id, async_work, effort, turn_id]

  turn_failed:
    direction: in
    required: [reason]
    optional: [session_id, message, detail, turn_id]

  tool_pre:
    direction: in
    required: []
    optional: [session_id, tool_id, tool_name, tool_target, tool_input]

  tool_post:
    direction: in
    required: []
    optional: [session_id, tool_id, tool_name, tool_target, tool_input, tool_result, duration_ms]

  # PostToolUseFailure fires INSTEAD OF PostToolUse, not alongside it. Mapping only
  # tool_post left a failed tool in flight until the turn-close sweep abandoned it.
  tool_fail:
    direction: in
    required: []
    optional: [session_id, tool_id, tool_name, tool_target, tool_input, tool_result, tool_error, duration_ms]

  subagent_pre:
    direction: in
    required: []
    optional: [session_id, subagent_id, agent_type]

  subagent_post:
    direction: in
    required: []
    optional: [session_id, subagent_id, agent_type]

  notification:
    direction: in
    required: []
    optional: [session_id, message]

  message_delta:
    direction: in
    # index is OPTIONAL, not required as the Go rule had it. claude numbers its deltas;
    # codex's item/agentMessage/delta carries only {delta, itemId, threadId, turnId},
    # so requiring an index would make codex unloadable. A provider that supplies none
    # is ordered by arrival, which is sound because its deltas arrive on one stream.
    required: [message_id, text]
    optional: [session_id, turn_id, index, final]

  # The model thinking out loud, as it happens. Same shape as message_delta and it
  # rides the same live channel, distinguished by kind — it is NOT the answer and
  # must never be recorded as one.
  #
  # This is the difference between a reasoning model looking busy and looking dead:
  # codex spends most of a hard turn here, emitting item/reasoning/summaryTextDelta
  # and nothing else (measured live against codex-cli 0.149.1). With no name for it
  # Crowbar showed a spinner and a rotating flavour verb for the whole of it.
  #
  # message_id groups the deltas of one thinking block. It is OPTIONAL rather than
  # required, unlike message_delta's: a provider that streams one undifferentiated
  # thought stream per turn has no id to give, and the turn is grouping enough.
  reasoning_delta:
    direction: in
    required: [text]
    optional: [session_id, message_id, turn_id, index, final]

  # A running tool's output as it is produced — the lines of a build, a test run,
  # a long command. Same shape and same live channel as reasoning_delta, and like
  # it never recorded: the tool's FULL output lands once, on tool_post.
  #
  # message_id is the tool call it belongs to, so a client can put the lines under
  # the right running row.
  tool_output_delta:
    direction: in
    required: [text]
    optional: [session_id, message_id, turn_id, index, final]

  # The agent's own running to-do list for this turn, restated WHOLESALE on every
  # update rather than as a diff — the newest list is the whole truth, exactly the
  # way turn_stop's async_work level is, and for the same anti-drift reason.
  #
  # The steps themselves are a structured extra (`steps:`), because a flat field
  # map cannot express a list of {text, status} pairs. Its status_map is where a
  # provider's own words for "in progress" get translated into Crowbar's, so Go
  # never learns them.
  plan_update:
    direction: in
    required: []
    optional: [session_id, turn_id, message]
    extras: [steps]

  session_end:
    direction: in
    required: []
    optional: [session_id, reason]

  # The provider's OWN word that it is doing nothing: no turn running, nothing
  # waiting on a person. It is not a turn-close event and must never be treated as
  # one — measured against codex-cli 0.149.1, it arrives IMMEDIATELY BEFORE the
  # turn-close on a perfectly healthy turn, so acting on it directly would abandon
  # every turn microseconds before it ended properly.
  #
  # What it is good for is the case nothing else can reach: a turn whose close is
  # never sent at all (codex.yaml records that happening live). The turn-close
  # clears the latch this arms; a latch still armed when the sweep next looks is a
  # turn nothing is going to close, and the provider has said so itself. That
  # replaces a 120s screen-scraping heuristic with an authoritative signal.
  idle:
    direction: in
    required: []
    optional: [session_id]

  # Compaction is a STATE the chat is in, not an interrupt that happened to a turn:
  # the CLI is busy, prompts queue, and the transcript needs a boundary marker so
  # AssembleHandoff stops replaying turns the model can no longer see.
  compact_pre:
    direction: in
    required: []
    # turn_id: see turn_stop's own doc comment — this is the half that ARMS
    # the latch turn_stop/turn_failed consult.
    optional: [session_id, trigger, turn_id]

  compact_post:
    direction: in
    required: []
    optional: [session_id, trigger, turn_id]

  telemetry:
    direction: in
    required: []
    optional:
      - session_id
      - context.capacity_tokens
      - context.used_tokens
      - context.used_percent
      - context.remaining_percent
      - cost.total_usd
      - cost.api_duration_ms
      - model.id
      - model.display_name
      - input_tokens
      - output_tokens
    extras: [rate_limits]

  permission:
    direction: ask
    # NOT prompt_id. claude carries one; codex's permission payload has none, and its
    # answers correlate by the hook delivery id instead. Requiring it here would make
    # codex fail to load.
    required: []
    optional:
      - prompt_id
      - session_id
      - message
      - tool_name
      - tool_target
      - tool_input
      - suggestions
      - suggestion_type
      - suggestion_description
      # Crowbar's words for each suggestion type — PROVIDER vocabulary, which Go must
      # never learn. A prefix family precisely so a new provider term is a YAML line.
      - suggestion_label.*
      - questions
      - question_title
      - question_text
      - question_options
      - question_multi
      - option_label
      - option_description
    extras: [answers_into]
    replies: [allow, deny, answer]

  elicitation:
    direction: ask
    required: []
    optional: [session_id, prompt_id, message, mode, schema, mcp_server]
    replies: [accept, decline, cancel]

  # --- outbound: Crowbar drives the CLI ---------------------------------------

  prompt:
    direction: out
    required: [text]
    # cwd is what a session-establishing Fresh/Resume step needs to create or
    # reload the right conversation — a hooks-transport provider's prompt
    # never references it, so it stays optional rather than required.
    #
    # context is the same handoff document a restart_tui spawn's context_inject
    # folds into its CLI argv (spawnRunner's tctx.Context, composed once,
    # transport-agnostic) — optional because it is only ever consumed by a
    # Fresh step establishing a brand-new session; a Resume step reloads a
    # session that already has its own history and has nothing to fold in.
    #
    # permission.* is the current chat's permission level's own named values
    # (TemplateCtx.PermissionVars) — a FAMILY, not fixed names, because what
    # a level needs to say is each provider's own business (codex's sandbox/
    # approvalPolicy; a future provider's own words for the same idea).
    optional: [session_id, cwd, context, "permission.*"]

  interrupt:
    direction: out
    required: []
    # turn_id is optional: a hooks-transport provider has no notion of one (its
    # descriptor's interrupt, if it declares any, has nowhere to source it from),
    # while an rpc-transport provider whose cancel call is scoped to a specific
    # turn — not just the thread — needs it. codex does; see codex.yaml.
    optional: [session_id, turn_id]

  # Crowbar asks for compaction. Codex exposes thread/compact/start; claude has no API
  # for it, so its descriptor injects the /compact slash command over the prompt
  # transport. Capability is key-presence: a provider that declares no compact_start
  # gets no compact control in the UI.
  compact_start:
    direction: out
    required: []
    optional: [session_id]
