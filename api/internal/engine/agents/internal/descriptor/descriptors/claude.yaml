# Validated against claude 2.1.201 (Phase-0 spike); the Stop hook's background_tasks
# against 2.1.212, by tracing every hook it fires through real sessions. Documentation
# only.
#
# Degrading safely on an OLDER claude needs no version gate: a Stop payload without
# background_tasks yields a count of 0, and Working folds back to the turn alone —
# exactly the behaviour before this existed.
id: claude
display_name: Claude
icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></svg>'
spawn:
  cmd: claude
  interactive_required: true
  forbid_flags: ["-p", "--print"]
  # A Crowbar chat opens in AUTO mode, not the default ask-before-everything one:
  # the pane is a working agent, and being prompted for each edit makes it useless.
  # (claude's own mode list: acceptEdits | auto | bypassPermissions | manual |
  # dontAsk | plan. NOT bypassPermissions/dontAsk — those skip every check.)
  args: ["--permission-mode", "auto"]
  env:
    clear: ["CLAUDE_CODE_CHILD_SESSION", "CLAUDECODE"]
session:
  resume: { arg: "--resume {id}" }
presentation:
  prompt_submit:
    strategy: restart_tui
    fresh:
      - pass_arg: { positional: "--" }
      - pass_arg: { positional: "{message}" }
    resume:
      - pass_arg: { positional: "--" }
      - pass_arg: { positional: "{message}" }
  # Claude exposes enabled plugin metadata without a model turn. The generic
  # inventory/detail adapter fans out only enabled rows and never reads Claude's
  # config or skill directories. Standalone user/project skills are not exposed
  # by this command surface, hence plugin_only rather than complete.
  slash_catalog:
    completeness: plugin_only
    timeout_ms: 10000
    max_stdout_bytes: 4194304
    max_stderr_bytes: 262144
    max_items: 200
    pipeline:
      adapter: json_inventory_text_detail
      command: ["plugin", "list", "--json"]
      rows_path: "[]"
      enabled_field: "enabled"
      id_field: "id"
      source_pattern: '^(?P<source>[^@]+)'
      detail_command: ["plugin", "details", "{id}"]
      # Horizontal whitespace ONLY ([^\S\r\n]) between the count and the list.
      # `\s+` there crosses the newline, so a plugin printing `Skills (0)` had the
      # NEXT inventory line captured as its skills — real output is
      #   Skills (0)
      #   Agents (1)  code-simplifier
      # which yielded a phantom skill named "Agents (1)  code-simplifier" and hid
      # the empty case, because the empty pattern is only consulted when this one
      # fails to match.
      detail_pattern: '(?m)^[^\S\r\n]*Skills[^\S\r\n]+\(\d+\):?[^\S\r\n]+(?P<items>[^\r\n]+?)[^\S\r\n]*$'
      detail_empty_pattern: '(?m)^[^\S\r\n]*Skills[^\S\r\n]+\(0\)[^\S\r\n]*:?[^\S\r\n]*$'
      detail_items_group: "items"
      detail_separator: ","
      detail_concurrency: 4
      item:
        label: "{source}:{name}"
        description: ""
        insert_text: "/{source}:{name} "
        source: "{source}"
# Model selection. The catalogue is DECLARED, NOT ENUMERATED, and it will go stale.
#
# claude exposes no machine-readable list of valid --model values: there is no
# `models list` command and no flag that prints one, so unlike the effort levels
# below there is nothing to verify this list against. What is declared here is a
# conservative set of the aliases currently accepted; a model added or retired by
# Anthropic changes nothing in this file until somebody edits it, and a chat
# holding a retired id fails at spawn with claude's own message. That is the
# accepted cost of shipping a picker at all, and it is why this block is
# overridable on disk like every other part of the descriptor.
#
# restart_tui is the only strategy: a running claude cannot be told to change
# model through any channel Crowbar has, so a changed choice takes effect on the
# next process. Every prompt already spawns one (presentation.prompt_submit),
# and a selection change forces one even when the delivery would not have.
model:
  available: [sonnet, opus, haiku]
  strategy: restart_tui
  apply:
    - pass_arg: { arg: "--model", value: "{model}" }
# Reasoning effort. This enum IS verified: measured 2026-08-17 by passing an
# invalid value, which claude rejects with
#   Error: Invalid effort level: <value>. Valid values: low, medium, high, xhigh, max.
# and exit status 1 — so the list is the CLI's own, not a guess.
#
# Keyed by "*" because claude's levels do not vary by model. The map shape exists
# for providers whose do (codex reports supported_reasoning_levels per model),
# and declaring the fallback key alone is how a provider says "these apply to
# everything".
effort:
  available:
    "*": [low, medium, high, xhigh, max]
  strategy: restart_tui
  apply:
    - pass_arg: { arg: "--effort", value: "{effort}" }
config_injection:
  # Every channel Crowbar listens on. The conversation trio was always here; the
  # rest is the observation surface, and its absence is what made a working agent
  # look like a frozen one — a provider blocked on a trust prompt showed nothing,
  # a compaction was invisible, and minutes of tool work rendered as "working…".
  #
  # statusLine is claude's telemetry channel. It is registered as an ordinary
  # `crowbar hook` invocation because from Crowbar's side it IS one: a command, a
  # JSON payload on stdin, write-only, scoped to the same segment. What arrives
  # over it is mapped by the provider-neutral `telemetry:` block below, NOT by a
  # section named after this mechanism.
  #
  # crowbar hook prints nothing on stdout, so claude renders an empty status line
  # rather than one of Crowbar's making.
  #
  # PermissionRequest and Elicitation carry an EXPLICIT `timeout`, in SECONDS,
  # because those two are the hooks Crowbar HOLDS OPEN while a human decides in
  # the chat (see `answer:` below). Measured against claude 2.1.234 on 2026-08-18:
  # the default is 600s, the value is honoured verbatim with no ceiling, and a
  # hook that overruns it is KILLED rather than abandoned. So the budget has to be
  # ours rather than a default we inherit, and the daemon's own wait
  # (answer.*.timeout_seconds) is set comfortably shorter than this so the relay
  # exits under its own control instead of being cut off mid-write.
  #
  # Every other hook is left on the provider's default: they return in
  # milliseconds and inheriting a default they never approach costs nothing.
  - write_file:
      path: "{tmp}/settings.json"
      content: |
        {"hooks":{
          "SessionStart":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook session_start --segment {segid} --provider {provider} {scope_flags}"}]}],
          "UserPromptSubmit":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook user_prompt --segment {segid} --provider {provider} {scope_flags}"}]}],
          "Stop":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook turn_stop --segment {segid} --provider {provider} {scope_flags}"}]}],
          "PreToolUse":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook tool_pre --segment {segid} --provider {provider} {scope_flags}"}]}],
          "PostToolUse":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook tool_post --segment {segid} --provider {provider} {scope_flags}"}]}],
          "PostToolUseFailure":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook tool_fail --segment {segid} --provider {provider} {scope_flags}"}]}],
          "SubagentStart":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook subagent_pre --segment {segid} --provider {provider} {scope_flags}"}]}],
          "SubagentStop":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook subagent_post --segment {segid} --provider {provider} {scope_flags}"}]}],
          "Notification":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook notification --segment {segid} --provider {provider} {scope_flags}"}]}],
          "PermissionRequest":[{"hooks":[{"type":"command","timeout":300,
            "command":"{crowbar_hook} hook permission --segment {segid} --provider {provider} {scope_flags}"}]}],
          "Elicitation":[{"hooks":[{"type":"command","timeout":300,
            "command":"{crowbar_hook} hook elicitation --segment {segid} --provider {provider} {scope_flags}"}]}],
          "PreCompact":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook compact_pre --segment {segid} --provider {provider} {scope_flags}"}]}],
          "PostCompact":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook compact_post --segment {segid} --provider {provider} {scope_flags}"}]}],
          "SessionEnd":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook session_end --segment {segid} --provider {provider} {scope_flags}"}]}]
        },
        "statusLine":{"type":"command",
          "command":"{crowbar_hook} hook telemetry --segment {segid} --provider {provider} {scope_flags}"}}
  - pass_arg: { arg: "--settings", value: "{tmp}/settings.json" }
# The Crowbar tool surface. --mcp-config takes a JSON STRING, so nothing is
# written to disk and the user's own MCP servers are untouched (verified
# against claude 2.1.220: the tools arrive as mcp__crowbar__*, and claude
# DEFERS their schemas until first use).
#
# It lives in its own step list because the user can switch the tool surface off
# for this provider without disabling the provider: everything in
# config_injection above still runs, so the CLI spawns and its hooks still fire,
# and only these steps are skipped. See Descriptor.MCPInject.
#
# Scope travels as discrete array elements, never {scope_flags}: each element
# reaches the process as its own argument, so a project-home workspace's empty
# repo id arrives as an empty string instead of swallowing the next token the
# way a flat shell string would (see TemplateCtx.ScopeFlags).
#
# The token is a SEPARATE credential from the segment id, not a reuse of it. The
# segment id is not secret — it is published on the chats API — so requiring a
# token beside it is what stops a copied command line or a mis-pointed relay
# acting as another runner by accident, and what keeps this relay unable to
# authorize itself: it forwards bytes, the daemon decides.
#
# It is NOT containment against an agent with a shell. The token sits in argv
# exactly as the id does and `ps` shows argv to the same user, and the daemon
# socket has no authentication at all — so shell access already reaches more
# than these tools do. See agenttools.TokenMinter.
#
# A BARE POSITIONAL MUST NEVER IMMEDIATELY FOLLOW THE JSON. `--mcp-config
# <configs...>` is VARIADIC — it keeps eating tokens until it meets a
# dash-prefixed one — so a positional after it is swallowed as an extra config.
# Observed on 2.1.220: `claude --mcp-config '<json>' mcp list` dies with "MCP
# config file not found: /private/tmp/mcp", having taken the subcommand as two
# more config paths. This list is rendered BEFORE the session/handoff steps, and
# those can be positionals (a resumed session's id), so what guarantees the rule
# today is that claude's own resume and context channels are both flags. That is
# not self-evident from here, so it is pinned by a test rather than by trust —
# see TestSpawnChat_Claude_MCPConfigIsNeverFollowedByAPositional.
mcp_injection:
  - pass_arg:
      arg: "--mcp-config"
      value: '{"mcpServers":{"crowbar":{"command":"{crowbar}","args":["mcp","--segment","{segid}","--token","{runner_token}","--project","{project_id}","--workspace","{workspace_id}","--repo","{repo_id}"]}}}'
hooks:
  format: json
  events:
    session_start: { session_id: session_id, model: model }
    user_prompt:   { message: prompt }
    # tool_target is an ALTERNATION, first non-empty wins: one Crowbar concept
    # lives at different payload paths depending on which tool fired. A file edit
    # puts it in file_path, a shell call in command, a fetch in url. Enumerating
    # claude's tool catalogue in the descriptor instead would go stale on every
    # release; naming the three shapes a target can take does not.
    tool_pre:
      session_id:  session_id
      tool_id:     tool_use_id
      tool_name:   tool_name
      tool_target: tool_input.file_path,tool_input.command,tool_input.url,tool_input.pattern
      tool_input:  tool_input
    tool_post:
      session_id:  session_id
      tool_id:     tool_use_id
      tool_name:   tool_name
      tool_target: tool_input.file_path,tool_input.command,tool_input.url,tool_input.pattern
      tool_input:  tool_input
      tool_result: tool_response
      duration_ms: duration_ms
    # PostToolUseFailure fires INSTEAD OF PostToolUse, not alongside it (measured
    # against claude 2.1.234 on 2026-08-17). Mapping only tool_post therefore left a
    # failed tool with no completion at all: it stayed in flight until the turn-close
    # sweep abandoned it, so "the Edit failed" rendered as "the Edit is still running"
    # for the rest of the turn.
    #
    # tool_result is an ALTERNATION here for the same reason tool_target is one: the
    # failure text lives under `error` where a success puts it under `tool_response`,
    # and both belong in the content store. tool_error additionally keeps a short,
    # inline copy so a timeline can say WHY without fetching a payload.
    tool_fail:
      session_id:  session_id
      tool_id:     tool_use_id
      tool_name:   tool_name
      tool_target: tool_input.file_path,tool_input.command,tool_input.url,tool_input.pattern
      tool_input:  tool_input
      tool_result: tool_response,error
      tool_error:  error
      duration_ms: duration_ms
    subagent_pre:  { session_id: session_id, subagent_id: agent_id, agent_type: agent_type }
    subagent_post: { session_id: session_id, subagent_id: agent_id, agent_type: agent_type }
    notification:  { session_id: session_id, message: message }
    # The permission's WHOLE useful payload, not just the tool's name.
    #
    # Measured against claude 2.1.234 on 2026-08-17, a PermissionRequest carries
    # prompt_id, permission_mode, tool_name, tool_input and permission_suggestions.
    # Keeping only tool_name is what made a blocked agent render as "waiting on
    # Bash" with no way to see what Bash was about to run.
    #
    # It carries NO tool_use_id, despite claude's own documentation claiming one, so
    # prompt_id is the only id here and the in-flight PreToolUse of the same tool name
    # is what the prompt is correlated to.
    #
    # permission_mode is deliberately NOT mapped. It read "default" in every payload
    # captured, including ones taken while the TUI was demonstrably in manual and in
    # auto — so it is a field that reports a value rather than the truth, and a
    # descriptor that maps nothing is more honest than one that maps that.
    #
    # AskUserQuestion is a TOOL, not an event: its questions arrive inside this very
    # tool_input, which is why the question vocabulary below is mapped on the
    # permission and nowhere else. Mapping it on tool_pre as well would open the same
    # prompt twice, under two ids that nothing can reconcile.
    permission:
      session_id:             session_id
      message:                tool_name
      prompt_id:              prompt_id
      tool_name:              tool_name
      tool_target:            tool_input.file_path,tool_input.command,tool_input.url,tool_input.pattern
      tool_input:             tool_input
      suggestions:            permission_suggestions
      suggestion_label:       type
      suggestion_description: mode,destination
      questions:              tool_input.questions
      question_title:         header
      question_text:          question
      question_options:       options
      question_multi:         multiSelect
      option_label:           label
      option_description:     description
    # Elicitation IS a hook event of its own — an MCP server asking the human a
    # question through the CLI. Measured against claude 2.1.234 on 2026-08-17:
    #   {"hook_event_name":"Elicitation","mcp_server_name":"spike",
    #    "message":"do you prefer A or B?","mode":"form",
    #    "requested_schema":{...}}
    # The schema is carried verbatim and never interpreted: what an elicitation
    # offers is a form, and a client renders it the way any MCP client would.
    elicitation:
      session_id: session_id
      message:    message
      mcp_server: mcp_server_name
      mode:       mode
      schema:     requested_schema
    compact_pre:   { session_id: session_id, trigger: trigger }
    compact_post:  { session_id: session_id, trigger: trigger }
    session_end:   { session_id: session_id, reason: reason }
    # async_work names the array on the Stop payload whose LENGTH is how much
    # asynchronous work claude says is STILL RUNNING as it goes quiet. That is the
    # whole fix for the dark spinner: claude hands work to a background subagent and
    # then ends its turn for real — it fires Stop right there and is re-invoked when
    # the subagent reports back — so Working folded from the turn alone went dark
    # under a live subagent and the chat looked dead.
    #
    # background_tasks, NOT the SubagentStart/SubagentStop pair, and not
    # session_crons. Traced against 2.1.212 through real sessions:
    #
    #   * background_tasks is a LEVEL claude RESTATES on every Stop, and it converges
    #     on its own: [running,running,running] → [running x4] (a subagent spawned
    #     more) → [running] → []. Entries vanish when their work is done, so the
    #     length is the answer and no arithmetic is needed. Crowbar keeps no tally,
    #     so it has no tally to get wrong — the spinner cannot be stranded ON by any
    #     sequence of hooks, only by a CLI that dies (which the reconcile paths
    #     handle) .
    #
    #   * SubagentStart/SubagentStop DO NOT BALANCE, in either direction, because
    #     they observe DIFFERENT POPULATIONS: Start fires only for typed subagents,
    #     while Stop ALSO fires for anonymous internal ones (agent_type: ""). One
    #     traced run: 1 Start, 3 Stops — the first Stop landing while the subagent
    #     was demonstrably still sleeping. Another: 4 Starts, 9 Stops. A previous
    #     attempt counted these (+1/-1) and shipped a spinner that spun forever.
    #     Under-counting strands it ON, over-counting clears it early. Do not count
    #     them.
    #
    #   * session_crons rides the same payload and is deliberately NOT counted: a
    #     cron is a SCHEDULE, not work in flight, so counting it would spin the
    #     spinner for the lifetime of the session.
    #
    # An INTERRUPT (ESC) fires no hook at all — not Stop, not Notification, nothing —
    # so no mapping here can observe it; the turn is closed by the next prompt
    # (StartTurn supersedes) or by the reconcile paths. That is pre-existing and
    # unreachable from the hook surface.
    turn_stop:
      session_id: session_id
      message: last_assistant_message
      async_work: background_tasks
      effort: effort.level
# The ANSWER channel — the write side of the two hooks above that ask a question.
#
# Everything here was measured live against claude 2.1.234 on 2026-08-18, by
# driving a real interactive PTY under `--permission-mode auto` (Crowbar's own
# spawn args) with these exact shapes on a throwaway --settings file:
#
#   * The `hookSpecificOutput` WRAPPER IS MANDATORY. A bare
#     {"decision":{"behavior":"allow"|"deny",...}} is rejected by claude's own hook
#     output validator — `Hook JSON output validation failed — (root): Invalid
#     input` — and the CLI falls straight through to its TUI dialog. Both the allow
#     and the deny form were measured failing without it and passing with it.
#
#   * AskUserQuestion IS answerable from PermissionRequest, which settles the one
#     open question this block existed to answer. The prompt arrives as
#     PreToolUse → PermissionRequest → (dialog), and returning `behavior: allow`
#     with an `updatedInput` carrying the original tool_input plus an `answers`
#     object keyed by the question's TEXT and valued with the option's LABEL makes
#     the tool return the answer: the following PostToolUse carried
#     "answers":{"Which option do you prefer?":"Option A"} in both tool_input and
#     tool_response, no dialog was drawn, no Notification fired, and the model
#     printed the label back. So the question vocabulary stays mapped on
#     `permission` — where it is observed — and is answered there too.
#
#   * A PreToolUse that ALLOWS suppresses PermissionRequest entirely, which is why
#     nothing here blocks on tool_pre: that hook fires for EVERY tool call, and
#     holding it open would stall work nobody was ever asked about.
#
#   * A hook that prints NOTHING and exits 0 falls through to the dialog in
#     milliseconds. That is the degradation route the relay takes whenever the
#     daemon cannot be reached, and it is why an unanswerable prompt costs nothing.
#
# `deny` carries the human's words through claude's `message`. There is
# deliberately no template for a `suggestion` option: claude's permission_suggestions
# would ride an `updatedPermissions` field that was never measured, and a broader
# grant that silently narrows to a plain allow is worse than a button that says it
# cannot do that.
answer:
  permission:
    # Shorter than the 300s `timeout` injected on the PermissionRequest hook, so
    # the relay stops waiting and exits cleanly rather than being killed mid-write.
    timeout_seconds: 270
    answers_into: answers
    responses:
      allow: '{"hookSpecificOutput":{"hookEventName":"PermissionRequest","decision":{"behavior":"allow"}}}'
      deny: '{"hookSpecificOutput":{"hookEventName":"PermissionRequest","decision":{"behavior":"deny","message":{reason_json}}}}'
      answer: '{"hookSpecificOutput":{"hookEventName":"PermissionRequest","decision":{"behavior":"allow","updatedInput":{tool_input_json}}}}'
  # An elicitation offers no options, so its decision keys are the MCP verbs
  # themselves. The accept shape is the one the earlier spike drove through a real
  # MCP server against 2.1.234: the server received
  # {"action":"accept","content":{...}} as its elicitation result.
  elicitation:
    timeout_seconds: 270
    responses:
      accept: '{"hookSpecificOutput":{"hookEventName":"Elicitation","action":"accept","content":{content_json}}}'
      decline: '{"hookSpecificOutput":{"hookEventName":"Elicitation","action":"decline"}}'
      cancel: '{"hookSpecificOutput":{"hookEventName":"Elicitation","action":"cancel"}}'
# claude reads an appended system prompt without being given a turn, and honours
# a FRESH one on --resume too (verified: `claude --resume <id>
# --append-system-prompt "<secret>"` answers from the secret), so the same silent
# channel serves both a fresh session and a resumed one.
context_inject:
  - pass_arg: { arg: "--append-system-prompt", value: "{context}" }
resume_context_inject:
  - pass_arg: { arg: "--append-system-prompt", value: "{context}" }
# Telemetry — the FACTS, not the transport.
#
# claude happens to deliver all four through one statusLine payload; another
# provider will split them differently, and a third will report only one. Each is
# therefore mapped independently, and a fact this block does not name simply never
# appears. Nothing is derived that was not reported.
#
# Measured live on 2026-08-17: the payload arrives with no client attached to the
# PTY (so it works with the Terminal closed), and it is change-driven rather than
# per-frame — 3 invocations across a 37s session with one turn, 2 across 60s of
# idle. context_window is null until the first turn completes, so a fresh session
# legitimately has no gauge.
telemetry:
  callback:
