# Validated against claude 2.1.236. An older claude degrades safely: a Stop payload
# without background_tasks yields a count of 0 and Working folds from the turn alone.
id: claude
display_name: Claude
icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></svg>'
spawn:
  cmd: claude
  interactive_required: true
  # Crowbar wraps the INTERACTIVE TUI. -p/--print would make it headless.
  forbid_flags: ["-p", "--print"]
  # auto, not the default ask-before-everything: the pane is a working agent.
  # NOT bypassPermissions/dontAsk — those skip every check.
  args: ["--permission-mode", "auto"]
  env:
    # Unset, or a claude spawned by Crowbar believes it is a nested child session.
    clear: ["CLAUDE_CODE_CHILD_SESSION", "CLAUDECODE"]
session:
  resume: { arg: "--resume {id}" }
presentation:
  prompt_submit:
    strategy: restart_tui
    fresh:
      # `--` first, so a message starting with a dash is text and not a flag.
      - pass_arg: { positional: "--" }
      - pass_arg: { positional: "{message}" }
    resume:
      - pass_arg: { positional: "--" }
      - pass_arg: { positional: "{message}" }
  # Enabled plugin metadata is readable without a model turn. Standalone
  # user/project skills are not, hence plugin_only rather than complete.
  slash_catalog:
    completeness: plugin_only
    timeout_ms: 10000
    max_stdout_bytes: 4194304
    max_stderr_bytes: 262144
    max_items: 200
    pipeline:
      adapter: json_inventory_text_detail
      command: ["plugin", "list", "--json"]
      rows_path: "[]"
      enabled_field: "enabled"
      id_field: "id"
      source_pattern: '^(?P<source>[^@]+)'
      detail_command: ["plugin", "details", "{id}"]
      # Horizontal whitespace ONLY. `\s+` crosses the newline, so a plugin printing
      # `Skills (0)` captured the NEXT inventory line as its skills.
      detail_pattern: '(?m)^[^\S\r\n]*Skills[^\S\r\n]+\(\d+\):?[^\S\r\n]+(?P<items>[^\r\n]+?)[^\S\r\n]*$'
      detail_empty_pattern: '(?m)^[^\S\r\n]*Skills[^\S\r\n]+\(0\)[^\S\r\n]*:?[^\S\r\n]*$'
      detail_items_group: "items"
      detail_separator: ","
      detail_concurrency: 4
      item:
        label: "{source}:{name}"
        description: ""
        insert_text: "/{source}:{name} "
        source: "{source}"
# DECLARED, NOT ENUMERATED: claude exposes no machine-readable list of --model values,
# so this goes stale silently. A retired id fails at spawn with claude's own message.
# restart_tui because a running claude cannot be told to change model.
model:
  available: [sonnet, opus, haiku]
  strategy: restart_tui
  apply:
    - pass_arg: { arg: "--model", value: "{model}" }
effort:
  # Verified: claude rejects an invalid --effort with "Valid values: low, medium,
  # high, xhigh, max". Keyed by "*" because its levels do not vary by model; the map
  # shape exists for providers whose do.
  available:
    "*": [low, medium, high, xhigh, max]
  strategy: restart_tui
  apply:
    - pass_arg: { arg: "--effort", value: "{effort}" }
config_injection:
  # Hooks and statusLine go in through --settings; Crowbar never writes to ~/.claude.
  # statusLine is claude's TELEMETRY channel, registered as a hook because from this
  # side it is one. What arrives over it is mapped by `telemetry:` below.
  #
  # PermissionRequest and Elicitation carry an explicit timeout because they are the
  # two hooks Crowbar HOLDS OPEN while a human decides. The default is 600s, honoured
  # verbatim with no ceiling, and an overrun is KILLED rather than abandoned — so the
  # budget must be ours, and answer.*.timeout_seconds sits under it.
  - write_file:
      path: "{tmp}/settings.json"
      content: |
        {"hooks":{
          "SessionStart":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook session_start --segment {segid} --provider {provider} {scope_flags}"}]}],
          "UserPromptSubmit":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook user_prompt --segment {segid} --provider {provider} {scope_flags}"}]}],
          "Stop":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook turn_stop --segment {segid} --provider {provider} {scope_flags}"}]}],
          "PreToolUse":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook tool_pre --segment {segid} --provider {provider} {scope_flags}"}]}],
          "PostToolUse":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook tool_post --segment {segid} --provider {provider} {scope_flags}"}]}],
          "PostToolUseFailure":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook tool_fail --segment {segid} --provider {provider} {scope_flags}"}]}],
          "SubagentStart":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook subagent_pre --segment {segid} --provider {provider} {scope_flags}"}]}],
          "SubagentStop":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook subagent_post --segment {segid} --provider {provider} {scope_flags}"}]}],
          "Notification":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook notification --segment {segid} --provider {provider} {scope_flags}"}]}],
          "PermissionRequest":[{"hooks":[{"type":"command","timeout":300,
            "command":"{crowbar_hook} hook permission --segment {segid} --provider {provider} {scope_flags}"}]}],
          "Elicitation":[{"hooks":[{"type":"command","timeout":300,
            "command":"{crowbar_hook} hook elicitation --segment {segid} --provider {provider} {scope_flags}"}]}],
          "PreCompact":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook compact_pre --segment {segid} --provider {provider} {scope_flags}"}]}],
          "PostCompact":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook compact_post --segment {segid} --provider {provider} {scope_flags}"}]}],
          "SessionEnd":[{"hooks":[{"type":"command",
            "command":"{crowbar_hook} hook session_end --segment {segid} --provider {provider} {scope_flags}"}]}]
        },
        "statusLine":{"type":"command",
          "command":"{crowbar_hook} hook telemetry --segment {segid} --provider {provider} {scope_flags}"}}
  - pass_arg: { arg: "--settings", value: "{tmp}/settings.json" }
# --mcp-config takes a JSON STRING: nothing is written to disk and the user's own MCP
# servers are untouched. Scope travels as discrete array elements so a project-home
# workspace's empty repo id stays an empty argument instead of swallowing the next
# token. The token is a separate credential from the segment id, which is published.
#
# --mcp-config is VARIADIC — it eats tokens until a dash-prefixed one — so a bare
# positional must NEVER follow it. Pinned by
# TestSpawnChat_Claude_MCPConfigIsNeverFollowedByAPositional.
mcp_injection:
  - pass_arg:
      arg: "--mcp-config"
      value: '{"mcpServers":{"crowbar":{"command":"{crowbar}","args":["mcp","--segment","{segid}","--token","{runner_token}","--project","{project_id}","--workspace","{workspace_id}","--repo","{repo_id}"]}}}'
hooks:
  format: json
  events:
    session_start: { session_id: session_id, model: model }
    user_prompt:   { message: prompt }
    # A comma-separated value is an ALTERNATION, first non-empty wins: one Crowbar
    # concept lives at different payload paths depending on which tool fired.
    tool_pre:
      session_id:  session_id
      tool_id:     tool_use_id
      tool_name:   tool_name
      tool_target: tool_input.file_path,tool_input.command,tool_input.url,tool_input.pattern
      tool_input:  tool_input
    tool_post:
      session_id:  session_id
      tool_id:     tool_use_id
      tool_name:   tool_name
      tool_target: tool_input.file_path,tool_input.command,tool_input.url,tool_input.pattern
      tool_input:  tool_input
      tool_result: tool_response
      duration_ms: duration_ms
    # PostToolUseFailure fires INSTEAD OF PostToolUse, not alongside it. Mapping only
    # tool_post left a failed tool in flight until the turn-close sweep abandoned it.
    tool_fail:
      session_id:  session_id
      tool_id:     tool_use_id
      tool_name:   tool_name
      tool_target: tool_input.file_path,tool_input.command,tool_input.url,tool_input.pattern
      tool_input:  tool_input
      tool_result: tool_response,error
      tool_error:  error
      duration_ms: duration_ms
    subagent_pre:  { session_id: session_id, subagent_id: agent_id, agent_type: agent_type }
    subagent_post: { session_id: session_id, subagent_id: agent_id, agent_type: agent_type }
    notification:  { session_id: session_id, message: message }
    # The permission's whole payload, not just the tool name — "waiting on Bash" with
    # no way to see what Bash would run is what mapping only tool_name produced.
    #
    # No tool_use_id despite claude's docs, so prompt_id is the only id here.
    # permission_mode is deliberately unmapped: it read "default" in every payload
    # captured, including ones taken in manual and in auto.
    #
    # AskUserQuestion is a TOOL, not an event — its questions arrive inside this
    # tool_input, which is why the question vocabulary is mapped here and nowhere
    # else. Mapping it on tool_pre too would open the same prompt twice.
    permission:
      session_id:             session_id
      message:                tool_name
      prompt_id:              prompt_id
      tool_name:              tool_name
      tool_target:            tool_input.file_path,tool_input.command,tool_input.url,tool_input.pattern
      tool_input:             tool_input
      suggestions:            permission_suggestions
      # claude's own machine name for a broader grant, never shown: putting it on a
      # control is how `addRules` appeared as though it were a pressable choice.
      suggestion_type:        type
      suggestion_description: mode,destination
      # Crowbar's words for each type — provider vocabulary, which Go must not learn.
      # A CAPTURE of the values that have actually arrived, not an enumeration;
      # anything else takes `default`. None is sendable: claude declares no response
      # template for a suggestion, so these are labelled to be read, not pressed.
      suggestion_label.addRules:       "Add a permanent rule for this"
      suggestion_label.addDirectories: "Allow this directory from now on"
      suggestion_label.setMode:        "Switch to a more permissive mode"
      suggestion_label.default:        "A broader permission than this one"
      questions:              tool_input.questions
      question_title:         header
      question_text:          question
      question_options:       options
      question_multi:         multiSelect
      option_label:           label
      option_description:     description
    # An MCP server asking the human a question through the CLI. The schema is
    # carried verbatim and never interpreted.
    elicitation:
      session_id: session_id
      message:    message
      mcp_server: mcp_server_name
      mode:       mode
      schema:     requested_schema
    compact_pre:   { session_id: session_id, trigger: trigger }
    compact_post:  { session_id: session_id, trigger: trigger }
    session_end:   { session_id: session_id, reason: reason }
    # async_work is the LEVEL of background work claude RESTATES on every Stop, and it
    # converges on its own — the length is the answer and Crowbar keeps no tally. This
    # is the fix for the dark spinner: claude hands work to a subagent and ends its
    # turn for real, so Working folded from the turn alone went dark under a live one.
    #
    # NOT SubagentStart/SubagentStop: they observe different populations and DO NOT
    # BALANCE (traced: 1 Start/3 Stops; 4 Starts/9 Stops). Counting them shipped a
    # spinner that spun forever. NOT session_crons: a schedule is not work in flight.
    #
    # An INTERRUPT (ESC) fires no hook at all, so nothing here can observe it.
    turn_stop:
      session_id: session_id
      message: last_assistant_message
      async_work: background_tasks
      effort: effort.level
# The provider's own transcript, because turn_stop.message is `last_assistant_message`
# — literally the last one. Everything a turn said before it reaches Crowbar only from
# here. Each hook payload hands us the path; this file declares the field NAME, never a
# location. READ-ONLY, always: open, stat, read, nothing else.
transcript:
  path_field: transcript_path
  format: jsonl
  message:
    match:
      type: assistant
      message.role: assistant
    # reject rather than match, because no positive rule expresses "not that" — neither
    # key is present on an ordinary entry. isSidechain marks a subagent's messages;
    # isApiErrorMessage is claude's own "API Error: 529" notice, written as assistant
    # text. Only `text` blocks are the agent's words: thinking is not something it
    # said, and a tool_use is already recorded by the tool hooks.
    reject:
      isSidechain: "true"
      isApiErrorMessage: "true"
    blocks: message.content
    block_match:
      type: text
    block_text: text
    join: "\n\n"
    timestamp: timestamp
# The hookSpecificOutput WRAPPER IS MANDATORY. A bare {"decision":{...}} is rejected by
# claude's own hook output validator and the CLI falls through to its TUI dialog.
#
# `answer` is also how AskUserQuestion is satisfied: allow, with updatedInput carrying
# the original tool_input plus an `answers` object keyed by question TEXT and valued
# with the option LABEL. No dialog is drawn and the model reads the label back.
#
# 270s against the hook's own 300s, so the relay exits under its own control rather
# than being cut off mid-write. Nothing blocks on tool_pre: a PreToolUse that allows
# suppresses PermissionRequest entirely, and that hook fires for every tool call.
#
# No `suggestion` response: its updatedPermissions shape was never measured, and
# silently narrowing a broader grant to a plain allow is worse than refusing.
answer:
  permission:
    timeout_seconds: 270
    answers_into: answers
    responses:
      allow: '{"hookSpecificOutput":{"hookEventName":"PermissionRequest","decision":{"behavior":"allow"}}}'
      deny: '{"hookSpecificOutput":{"hookEventName":"PermissionRequest","decision":{"behavior":"deny","message":{reason_json}}}}'
      answer: '{"hookSpecificOutput":{"hookEventName":"PermissionRequest","decision":{"behavior":"allow","updatedInput":{tool_input_json}}}}'
  elicitation:
    timeout_seconds: 270
    responses:
      accept: '{"hookSpecificOutput":{"hookEventName":"Elicitation","action":"accept","content":{content_json}}}'
      decline: '{"hookSpecificOutput":{"hookEventName":"Elicitation","action":"decline"}}'
      cancel: '{"hookSpecificOutput":{"hookEventName":"Elicitation","action":"cancel"}}'
# claude reads an appended system prompt without being given a turn, and honours a
# fresh one on --resume too, so one silent channel serves both.
context_inject:
  - pass_arg: { arg: "--append-system-prompt", value: "{context}" }
resume_context_inject:
  - pass_arg: { arg: "--append-system-prompt", value: "{context}" }
# The telemetry FACTS, not the transport. No claude HOOK carries token, context or cost
# data; statusLine is the only channel that does. Each fact is mapped independently so
# a provider that reports only one still works. context_window is null until the first
# turn completes, so a fresh session legitimately has no gauge.
telemetry:
  callback:
    format: json
    fields:
      context.capacity_tokens:   context_window.context_window_size
      context.used_tokens:       context_window.total_input_tokens
      context.used_percent:      context_window.used_percentage
      context.remaining_percent: context_window.remaining_percentage
      cost.total_usd:            cost.total_cost_usd
      cost.api_duration_ms:      cost.total_api_duration_ms
      model.id:                  model.id
      model.display_name:        model.display_name
    rate_limits:
      - id: five_hour
        label: "5-hour"
        used_percent: rate_limits.five_hour.used_percentage
        resets_at: rate_limits.five_hour.resets_at
      - id: seven_day
        label: "7-day"
        used_percent: rate_limits.seven_day.used_percentage
        resets_at: rate_limits.seven_day.resets_at
# Prompts claude's OWN HARNESS submits, which arrive on the same hook the user's do.
#
# UserPromptSubmit carries both and its payload does not say which: Crowbar's delivery,
# a human typing, and the harness's subagent report all arrive with an identical key
# set, and the documented `source` field was ABSENT on all three. So this is a TEXT
# MATCH, which is weaker than a discriminator, and it should be deleted the day claude
# starts sending one.
#
# Compared as a case-sensitive PREFIX of the raw prompt after leading whitespace — NOT
# with the reduction terminal_prompts uses, which would strip the angle brackets that
# are the whole point. Prefix, so a person asking ABOUT a task notification is still
# recorded as the person: a miss degrades to "recorded as the user", a false hit
# silences a human.
injected_prompts:
  - kind: task_notification
    needle: "<task-notification>"
# Modals that reach Crowbar through NO hook — the complement of `answer:` above.
# claude paints its first-run trust dialog BEFORE it fires a single hook, so a chat
# behind one is an empty pane over a live, blocked process. Crowbar has no channel to
# answer these; it can only say so and send the user to the terminal.
#
# Matching ignores spacing and punctuation (see the termprompt package), so the box
# drawing and wrapping claude puts around these does not defeat them.
terminal_prompts:
  # trust's own option text, which appears on no other screen.
  - kind: workspace_trust
    needle: "I trust this folder"
  # the footer EVERY claude selection modal paints — trust, a login, a migration
  # notice. Unkinded, because a match justifies only "something is blocking".
  - needle: "Enter to confirm"
# NO terminal_notices AND NO IDLE NEEDLE, both measured rather than missing. claude's
# Stop hook is reliable and no notice-shaped message has been captured from it; and its
# footer hint is painted while generating and is mode- and model-dependent, so there is
# nothing to read as "idle".
