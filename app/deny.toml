[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
]

[advisories]
version = 2
yanked = "deny"
# Every entry is an unmaintained-crate notice with no safe upgrade, reached only through gpui
# (patched copy in desktop/vendor) or wry/gtk-rs. Each is dropped when the named parent bumps.
# Review at every gpui or wry upgrade; delete an entry as soon as `cargo deny check` stops needing it.
ignore = [
  { id = "RUSTSEC-2025-0052", reason = "async-std discontinued; via gpui_http_client and zed-async-tar. Revisit when gpui bumps." },
  { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained; via async-std, same gpui subtree. Revisit when gpui bumps." },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; via gpui (metal, core-video). Revisit when gpui bumps." },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained; via gpui (stacksafe-macro). Revisit when gpui bumps." },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; via glib-macros of gtk-rs 0.18, which wry/webview use on Linux. Revisit when wry moves to gtk4 or a newer gtk-rs." },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; via gpui's zed-reqwest. Revisit when gpui bumps." },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; via gpui (cosmic-text, usvg). Revisit when gpui bumps." },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; via gpui (cosmic-text, fontdb, usvg). Revisit when gpui bumps." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; via zbus under gpui's ashpd and oo7. Revisit when gpui or zbus bumps." },
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; via oo7 and zbus under gpui. Revisit when gpui or zbus bumps." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; via zvariant under gpui. Revisit when gpui or zbus bumps." },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Crowbar itself is AGPL-3.0-only OR LicenseRef-Commercial (legal/LICENSING.md). Dependencies must be
# permissive or weak copyleft so the commercial offer stays possible: no GPL, LGPL or AGPL crates.
# Fonts (legal/licenses: OFL-1.1, MIT) are assets, not crates.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "Unicode-3.0",
]
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# The bans guard code we write. Transitive uses are allowed only through the exact direct parents
# below, which are third-party crates we cannot change; a new parent fails the check and needs review.
deny = [
  { crate = "lazy_static", reason = "use std::sync::LazyLock inside a constructor, or pass state in (M24)", wrappers = [
    "num-bigint-dig",  # oo7 keyring under gpui. Revisit when gpui bumps.
    "sharded-slab",    # tracing-subscriber (diagnostics). Revisit when tracing-subscriber drops it.
    "zed-font-kit",    # gpui. Revisit when gpui bumps.
  ] },
  { crate = "once_cell", reason = "std covers it; global init is banned by M24", wrappers = [
    "ahash",                  # zed-xim under gpui
    "async-global-executor",  # async-std under gpui
    "async-std",              # gpui_http_client under gpui
    "blade-graphics",         # gpui Linux renderer
    "cairo-rs",               # gtk-rs 0.18 under wry (webview)
    "const-random-macro",     # ahash under gpui
    "dbus-secret-service",    # keyring's Linux Secret Service store (transport); upstream
    "gdk-pixbuf",             # gtk-rs 0.18 under wry
    "gio",                    # gtk-rs 0.18 under wry
    "glib",                   # gtk-rs 0.18 under wry
    "is-docker",              # gpui
    "is-wsl",                 # gpui
    "naga",                   # blade-graphics under gpui
    "pango",                  # gtk-rs 0.18 under wry
    "proc-macro-crate",       # gtk-rs 0.18 macros
    "read-fonts",             # gpui font stack
    "rustls",                 # zed-reqwest under gpui; daemon transport
    "tempfile",               # temp files in tests and the app; upstream
    "tracing-core",           # tracing
    "tracing-subscriber",     # diagnostics
    "wayland-sys",            # gpui Linux
    "webkit2gtk",             # wry on Linux
    "wry",                    # the web view crate (webview)
    "x11-dl",                 # gpui Linux
    "yeslogic-fontconfig-sys",  # gpui font stack
    "zed-reqwest",            # gpui_http_client under gpui
  ] },
  { crate = "ctor", reason = "init magic (M24)", wrappers = [
    "gpui-pre-macos",  # gpui's macOS platform registers its classes at load. Revisit when gpui bumps.
  ] },
  { crate = "inventory", reason = "init magic (M24)", wrappers = [
    "gpui-pre",  # action and element registry. Revisit when gpui bumps.
  ] },
  { crate = "linkme", reason = "init magic (M24)" },
  { crate = "failure", reason = "unmaintained; use thiserror" },
  { crate = "error-chain", reason = "unmaintained; use thiserror" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
