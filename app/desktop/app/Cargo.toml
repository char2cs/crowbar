[package]
name = "crowbar_desktop"
description = "The Crowbar desktop shell: a GPUI window that hosts panes as web views."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "crowbar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
atomicfile.workspace = true
async-channel.workspace = true
browser_agent.workspace = true
browser_chrome.workspace = true
browser.workspace = true
branch_import_view.workspace = true
oobe_view.workspace = true
pairing_view.workspace = true
remote_folder_picker.workspace = true
supervisor.workspace = true
gpui.workspace = true
image = { workspace = true, features = ["png"] }
base64 = "0.22"
layout_view.workspace = true
layout.workspace = true
pane_host.workspace = true
protocol.workspace = true
serde_json.workspace = true
settings_ui.workspace = true
diagnostics.workspace = true
shell_keys.workspace = true
platform.workspace = true
smallvec.workspace = true
shell_data.workspace = true
sidebar.workspace = true
startup_view.workspace = true
tab_bar.workspace = true
thiserror.workspace = true
terminal.workspace = true
terminal_session.workspace = true
terminal_view.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing.workspace = true
transport = { workspace = true, features = ["os-keychain"] }
ui.workspace = true
webview.workspace = true
window_state.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
transport = { workspace = true, features = ["loopback"] }
webview = { workspace = true, features = ["mock"] }

[lints]
workspace = true
