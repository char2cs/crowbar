[package]
name = "crowbar_desktop"
description = "The Crowbar desktop shell: a GPUI window that hosts panes as web views."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "crowbar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-channel.workspace = true
daemon_supervisor.workspace = true
gpui.workspace = true
layout_view.workspace = true
model.workspace = true
pane_host.workspace = true
protocol.workspace = true
serde_json.workspace = true
settings_ui.workspace = true
sidebar.workspace = true
startup_view.workspace = true
tab_bar.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
transport.workspace = true
ui.workspace = true
webview.workspace = true

[dev-dependencies]
tempfile = "3"
webview = { workspace = true, features = ["mock"] }

[lints]
workspace = true
