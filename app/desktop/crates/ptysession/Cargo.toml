[package]
name = "ptysession"
description = "Connects a native terminal view to the daemon: creates the PTY session over REST and pumps its websocket through the shell's loopback relay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
async-channel.workspace = true
daemonapi.workspace = true
journal.workspace = true
protocol.workspace = true
serde_json.workspace = true
terminal.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tokio-tungstenite = "0.30"
tracing.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
