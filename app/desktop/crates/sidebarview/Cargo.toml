[package]
name = "sidebarview"
description = "Native sidebar of the Crowbar shell: frame, header, space switcher, mode bar, chats tree, files and changes panels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# DemoShell of the sidebar crate, for the gallery.
fixtures = ["sidebar/fixtures"]

[[bin]]
name = "sidebargallery"
path = "src/bin/gallery/main.rs"
required-features = ["fixtures"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
sidebar.workspace = true
tracing.workspace = true
ui.workspace = true

[dev-dependencies]
ui = { workspace = true, features = ["test-support"] }
sidebar = { workspace = true, features = ["fixtures"] }
gpui = { workspace = true, features = ["bench-support", "test-support"] }

[lints]
workspace = true
