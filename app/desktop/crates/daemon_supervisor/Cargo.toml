[package]
name = "daemon_supervisor"
description = "Finds, spawns, health-checks, recovers and stops the Crowbar daemon sidecar."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
test-daemon = []

[[bin]]
name = "fake_daemon"
path = "src/bin/fake_daemon.rs"
required-features = ["test-daemon"]

[dependencies]
rustix = { version = "1", features = ["process", "param"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing.workspace = true
transport = { path = "../../../crates/transport" }

[dev-dependencies]
daemon_supervisor = { path = ".", features = ["test-daemon"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
