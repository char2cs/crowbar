[package]
name = "platform"
description = "Desktop services of the Crowbar shell: open a link in the system browser, reveal a path in the file manager, the rule that decides where a link may go, and every unsafe OS call."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
raw-window-handle.workspace = true
thiserror.workspace = true
tracing.workspace = true
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { workspace = true, features = ["shape"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSGraphics", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSViewController"] }

[lints]
workspace = true

# AppKit views need the main thread, which libtest never gives a test, so main runs the cases.
[[test]]
name = "platform"
path = "tests/platform.rs"
harness = false
