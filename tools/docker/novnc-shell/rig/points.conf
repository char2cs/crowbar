# Window-relative points (x,y) the rig clicks, for the standard 1280x800 window with the sidebar
# on the left and the seeded tabs open (`rig init`). Override any of them in ~/.rig/points.conf.
# The seeded chats in the sidebar: "Perf fixture: 30 turns" and the workspace's "Untitled chat".
tauri_perf_chat=150,268
rust_perf_chat=150,268
tauri_untitled_chat=150,223
rust_untitled_chat=150,223
# Tab strip: tab 1 (Perf fixture) and tab 2 (Untitled chat) — the tab switch targets.
tauri_switch_a=410,21
rust_switch_a=410,21
tauri_switch_b=650,21
rust_switch_b=650,21
# The chat composer of the Perf fixture tab, and a point over its transcript.
tauri_composer=640,737
rust_composer=640,735
tauri_scroll=640,400
rust_scroll=640,400
