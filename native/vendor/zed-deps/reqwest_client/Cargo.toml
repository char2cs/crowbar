[package]
name = "reqwest_client"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[features]
test-support = []

[lib]
path = "src/reqwest_client.rs"
doctest = true

[dependencies]
anyhow = "1.0.86"
bytes = "1.0"
futures = "0.3.32"
http_client = { path = "../http_client" }
serde = { version = "1.0.221", features = ["derive", "rc"] }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
regex = "1.5"
reqwest = { version = "0.12.15-zed", package = "zed-reqwest", git = "https://github.com/zed-industries/reqwest.git", rev = "c15662463bda39148ba154100dd44d3fba5873a4", default-features = false, features = ["charset", "http2", "macos-system-configuration", "multipart", "rustls-tls-native-roots", "socks", "stream"] }
gpui_util = { path = "../gpui_util" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
http_client_tls = { path = "../http_client_tls" }

[dev-dependencies]
