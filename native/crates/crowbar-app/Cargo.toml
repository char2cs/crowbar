[package]
name = "crowbar-app"
description = "the Crowbar native binary: window and menu wiring, panes, routing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crowbar-proto.workspace = true
crowbar-client.workspace = true
crowbar-sidecar.workspace = true
crowbar-core.workspace = true
crowbar-ui.workspace = true
crowbar-state.workspace = true
crowbar-terminal.workspace = true
crowbar-editor.workspace = true
crowbar-diff.workspace = true
crowbar-webview.workspace = true
crowbar-platform.workspace = true
crowbar-driver = { workspace = true, optional = true }
# The binary is the one crate that owns the platform: `gpui_platform` is where
# `application()` lives, and nothing upstream can supply it. `gpui` and
# `gpui-component` are direct rather than via crowbar-ui's re-export because
# this crate constructs the app and the window, not views over the design
# system.
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true

# The gate surface's layout assertions read the row's post-layout bounds, and
# the only thing that can read them is the driver's extractor. A dev-dependency
# rather than the `driver` feature so that `cargo test --workspace` — the gate
# everybody actually runs — measures the layout instead of skipping it.
[dev-dependencies]
crowbar-driver.workspace = true
# `#[gpui::test]` needs `TestAppContext`, which gpui gates behind
# `test-support`. Named here rather than reached through the normal entry
# because a feature has to be requested on the package and the dependency above
# cannot carry one; nothing outside `#[cfg(test)]` uses it.
gpui = { workspace = true, features = ["test-support"] }

# §10.4: the driver is in-process and behind `--features driver`. A default
# build must not link it.
[features]
default = []
driver = ["dep:crowbar-driver"]

[lints]
workspace = true
