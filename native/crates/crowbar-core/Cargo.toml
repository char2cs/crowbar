[package]
name = "crowbar-core"
description = "all Crowbar domain logic: git model, diff algebra, keymap resolution, settings schema, file-tree model, workspace scoping, review threads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# §4.3 rule 1, D2: this crate MUST NOT depend on gpui. Not now, not ever, not
# transitively. `scripts/check-invariants.sh` greps this file. If a piece of
# logic seems to need gpui, it is not logic — split it.
[dependencies]
crowbar-proto.workspace = true
crowbar-client.workspace = true
# `filetree::gitignore`'s per-directory `.gitignore` matcher — ripgrep's own
# crate, not gpui-adjacent. See that module's doc comment for the dependency
# decision and the `Match`-vs-npm-`ignore` equivalence check.
ignore.workspace = true

# `crowbar-core::git::normalize_diff`'s regression test needs to deserialise a
# raw wire fixture (the exact stale-persisted-shape bug it documents) to prove
# `crowbar-proto`'s null-to-default guard still handles it — a dev-dependency
# is not part of the crate's public dependency graph and nothing outside
# `tests`/`#[cfg(test)]` modules can reach it. Same reasoning, same wording, as
# `crowbar-proto`'s own dev-dependency on `serde_json` for its round-trip
# suite, and `crowbar-driver`'s dev-dependency on gpui's `test-support`.
[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
