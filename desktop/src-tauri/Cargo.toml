[package]
name = "crowbar-desktop"
version = "0.0.0"
description = "Crowbar Desktop"
authors = ["Rabbyte Software"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "crowbar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hyperlocal = "0.9"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
dirs = "5"
log = "0.4"
thiserror = "2"
window-vibrancy = "0.6"
tauri-plugin-macos-fps = "0.1.0"

[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.26"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
