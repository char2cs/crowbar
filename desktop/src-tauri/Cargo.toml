[package]
name = "crowbar-desktop"
version = "0.0.0"
description = "Crowbar Desktop"
authors = ["Rabbyte Software"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "crowbar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-tungstenite = "0.24"
futures-util = "0.3"
bytes = "1"
log = "0.4"
thiserror = "2"
window-vibrancy = "0.7"
tauri-plugin-macos-fps = "0.1.0"
# Dev-only: lets the Tauri MCP server drive/inspect the webview. Registered
# behind cfg(debug_assertions) in lib.rs so it is never active in release builds.
tauri-plugin-mcp-bridge = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# Diagnostics-bundle export (Settings -> Export diagnostics): deflate only.
zip = { version = "2", default-features = false, features = ["deflate"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
