name: iOS build

# Called by nightly / prerelease / stable-release. With the Apple secrets it builds
# a signed .ipa and uploads it to TestFlight; without them it builds an unsigned
# simulator .app and uploads it as the `ios-simulator` artifact. See docs/ios-release.md.
on:
  # Manual runs build the checked-out ref without publishing anything.
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version, e.g. 0.1.0
        type: string
        default: 0.0.0
      channel:
        description: VITE_BUILD_CHANNEL (nightly | beta | release)
        type: string
        default: nightly
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        default: ''
      version:
        description: Marketing version (CFBundleShortVersionString), e.g. 0.1.0
        type: string
        required: true
      channel:
        description: VITE_BUILD_CHANNEL (nightly | beta | release)
        type: string
        required: true
      build-version:
        description: VITE_BUILD_VERSION (tag shown in the UI)
        type: string
        default: ''
      timestamp:
        description: VITE_BUILD_TIMESTAMP
        type: string
        default: ''
    secrets:
      APPLE_TEAM_ID:
        required: false
      IOS_CERTIFICATE:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_MOBILE_PROVISION:
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_API_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  ios:
    # Pinned to macos-26 (NOT macos-latest): the iOS 26 SDK and the Icon Composer
    # .icon actool support need Xcode 26.5, which macos-latest may not resolve to.
    runs-on: macos-26
    env:
      VERSION: ${{ inputs.version }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Decide signed vs simulator build
        id: mode
        run: |
          if [ -n "$APPLE_DEVELOPMENT_TEAM" ] && [ -n "$IOS_CERTIFICATE" ] && [ -n "$IOS_CERTIFICATE_PASSWORD" ] \
            && [ -n "$IOS_MOBILE_PROVISION" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple signing secrets absent: building the unsigned simulator app"
          fi
          # Unique and increasing per upload across all three workflows (run numbers are per workflow).
          echo "build=$(date -u +%y%m%d%H%M)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Remove stray Rust toolchains (keeps rust-cache's env hash stable)
        run: |
          for tc in $(rustup toolchain list | awk '{print $1}' | grep -v '^1\.90'); do
            rustup toolchain uninstall "$tc"
          done
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ios-${{ steps.mode.outputs.signed }}
      - uses: oven-sh/setup-bun@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install tauri-cli
        run: cargo binstall tauri-cli@^2 --targets aarch64-apple-darwin --no-confirm --locked
      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_BUILD_CHANNEL: ${{ inputs.channel }}
          VITE_BUILD_VERSION: ${{ inputs.build-version }}
          VITE_BUILD_TIMESTAMP: ${{ inputs.timestamp }}
        run: cd web && bun install --frozen-lockfile && bun run build
      - name: Sync version into tauri.conf.json
        run: jq ".version = \"${VERSION}\"" desktop/src-tauri/tauri.conf.json > "$RUNNER_TEMP/tc.json" && mv "$RUNNER_TEMP/tc.json" desktop/src-tauri/tauri.conf.json

      - name: Build simulator app (unsigned)
        if: steps.mode.outputs.signed != 'true'
        working-directory: desktop/src-tauri
        # tauri-cli rejects an empty team even with --no-sign, and tries to import a certificate from
        # any signing var that is merely set (empty secrets are set), so unset those for this step.
        env:
          APPLE_DEVELOPMENT_TEAM: UNSIGNED000
        run: env -u IOS_CERTIFICATE -u IOS_CERTIFICATE_PASSWORD -u IOS_MOBILE_PROVISION cargo tauri ios build --ci --debug --target aarch64-sim --no-sign --archive-only --config '{"bundle":{"iOS":{"bundleVersion":"${{ steps.mode.outputs.build }}"}}}'
      - name: Package simulator app
        if: steps.mode.outputs.signed != 'true'
        run: |
          APP=$(find desktop/src-tauri/gen/apple/build -name '*.app' -path '*Products/Applications*' | head -1)
          [ -d "$APP" ] || (echo "simulator .app missing" && exit 1)
          ditto -c -k --keepParent "$APP" "Crowbar_${VERSION}_ios-simulator.app.zip"
      - uses: actions/upload-artifact@v7
        if: steps.mode.outputs.signed != 'true'
        with:
          name: ios-simulator
          path: Crowbar_*_ios-simulator.app.zip

      - name: Build signed IPA
        if: steps.mode.outputs.signed == 'true'
        working-directory: desktop/src-tauri
        run: cargo tauri ios build --ci --export-method app-store-connect --config '{"bundle":{"iOS":{"bundleVersion":"${{ steps.mode.outputs.build }}"}}}'
      - name: Verify IPA version
        if: steps.mode.outputs.signed == 'true'
        run: |
          IPA=$(find desktop/src-tauri/gen/apple/build -name '*.ipa' | head -1)
          [ -s "$IPA" ] || (echo "ipa missing" && exit 1)
          unzip -p "$IPA" 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          got=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/Info.plist")
          [ "$got" = "${{ steps.mode.outputs.build }}" ] || (echo "CFBundleVersion is $got, expected ${{ steps.mode.outputs.build }}" && exit 1)
          echo "IPA=$IPA" >> "$GITHUB_ENV"
      - name: Upload to TestFlight
        if: steps.mode.outputs.signed == 'true'
        run: |
          mkdir -p "$HOME/.private_keys"
          echo "$ASC_KEY" | base64 --decode > "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
