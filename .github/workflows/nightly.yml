name: Nightly

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  derive-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      timestamp: ${{ steps.v.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          VERSION=$(grep -m1 '^version' app/mobile/src-tauri/Cargo.toml | grep -oP '[\d.]+')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

  daemon:
    needs: derive-version
    # The darwin watcher is an FSEvents stream (cgo), so darwin binaries build on
    # a macOS runner; Linux stays CGO_ENABLED=0.
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            platforms: linux/amd64 linux/arm64
            cgo: '0'
          - os: darwin
            runner: macos-26
            platforms: darwin/amd64 darwin/arm64
            cgo: '1'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache-dependency-path: api/go.sum
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_BUILD_CHANNEL: nightly
          VITE_BUILD_TIMESTAMP: ${{ needs.derive-version.outputs.timestamp }}
        run: cd app/panes && bun install --frozen-lockfile && bun run build
      - name: Stage web assets for embedding
        run: cd api && make embed-web
      - name: Build daemon
        run: |
          mkdir -p dist
          cd api
          for PLATFORM in ${{ matrix.platforms }}; do
            OS=${PLATFORM%/*}; ARCH=${PLATFORM#*/}
            GOOS=$OS GOARCH=$ARCH CGO_ENABLED=${{ matrix.cgo }} go build \
              -o ../dist/crowbar-api-${OS}-${ARCH} ./cmd/crowbar
          done
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-daemon-${{ matrix.os }}
          path: dist/

  desktop:
    needs: derive-version
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit
    with:
      version: ${{ needs.derive-version.outputs.version }}-nightly
      channel: nightly
      timestamp: ${{ needs.derive-version.outputs.timestamp }}
      artifact-prefix: nightly

  ios:
    needs: derive-version
    uses: ./.github/workflows/ios-build.yml
    secrets: inherit
    with:
      ref: develop
      version: ${{ needs.derive-version.outputs.version }}
      channel: nightly
      timestamp: ${{ needs.derive-version.outputs.timestamp }}

  publish:
    needs: [derive-version, daemon, desktop, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts/
          merge-multiple: true
      # Quiver addresses release assets as Crowbar_${REF}_*, where REF is the git tag it
      # resolved. The bundles are named from the app version, so without this the tag and the
      # filename disagree and every arrow.yaml would have to restate the version.
      - name: Rename app bundles to the release tag
        env:
          TAG: nightly
        run: |
          cd release-artifacts
          find . -type f -name 'Crowbar_*' | while read -r f; do
            base=$(basename "$f")
            suffix=${base#Crowbar_*_}
            new="Crowbar_${TAG}_${suffix}"
            if [ "$base" != "$new" ]; then
              mv "$f" "$(dirname "$f")/${new}"
              echo "renamed ${base} -> ${new}"
            fi
          done
      # Before the old nightly is deleted: a release the manifest cannot install never replaces it.
      - name: Check ARROW.md can install this release
        run: bash tools/scripts/check-arrow.sh nightly release-artifacts
      - name: Generate unified SHA256SUMS
        run: |
          cd release-artifacts
          find . -type f ! -name 'SHA256SUMS' -exec sha256sum {} \; | sed 's|./||' > SHA256SUMS
      - name: Delete previous nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
      - name: Publish nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Nightly (${{ github.run_id }})"
          body: |
            Automated nightly build from `develop` — ${{ github.sha }}

            > ⚠️ This is an unstable build. Use at your own risk.
          prerelease: true
          files: release-artifacts/**/*
