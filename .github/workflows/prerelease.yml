name: Pre-release

on:
  push:
    branches:
      - 'prerelease/**'

# Cancel previous runs on the same branch — one beta at a time
concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  derive-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute beta tag
        id: tag
        run: |
          VERSION=$(grep -m1 '^version' desktop/src-tauri/Cargo.toml | grep -oP '[\d.]+')
          BETA_NUM=$(( $(git tag -l "v${VERSION}-beta.*" | wc -l | tr -d ' ') + 1 ))
          TAG="v${VERSION}-beta.${BETA_NUM}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Pre-release tag: ${TAG}"

  daemon:
    needs: derive-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache-dependency-path: api/go.sum
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: cd web && bun install --frozen-lockfile && bun run build
      - name: Stage web assets for embedding
        run: cd api && make embed-web
      - name: Cross-compile daemon
        run: |
          mkdir -p dist
          cd api
          for PLATFORM in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            OS=${PLATFORM%/*}; ARCH=${PLATFORM#*/}
            GOOS=$OS GOARCH=$ARCH CGO_ENABLED=0 go build \
              -o ../dist/crowbar-api-${OS}-${ARCH} ./cmd/crowbar
          done
      - uses: actions/upload-artifact@v7
        with:
          name: daemon-binaries
          path: dist/

  desktop-macos:
    needs: derive-tag
    # Pinned to macos-26 (NOT macos-latest): the Liquid Glass icon step needs an
    # Xcode whose actool can compile Icon Composer .icon assets. macOS 26 ships
    # Xcode 26.5 which does; macOS 15's newest is Xcode 26.3.0 whose actool
    # CRASHES on our .icon (CompileAssetCatalogVariant exit 65). `macos-latest`
    # is mid-migration from 15→26 and nondeterministically lands on either, so it
    # must not be used here.
    runs-on: macos-26
    env:
      VERSION: ${{ needs.derive-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache-dependency-path: api/go.sum
      - uses: oven-sh/setup-bun@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install tauri-cli
        run: cargo binstall tauri-cli@^2 --no-confirm --locked
      - name: Build Go sidecar (arm64 + amd64)
        run: |
          mkdir -p desktop/src-tauri/binaries
          cd api
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -tags noEmbed \
            -o ../desktop/src-tauri/binaries/crowbar-api-aarch64-apple-darwin ./cmd/crowbar
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -tags noEmbed \
            -o ../desktop/src-tauri/binaries/crowbar-api-x86_64-apple-darwin ./cmd/crowbar
          # cargo tauri build --target universal-apple-darwin bundles a single
          # sidecar named for the "universal-apple-darwin" triple — it does not
          # lipo the two arch-specific sidecars above on its own.
          lipo -create \
            ../desktop/src-tauri/binaries/crowbar-api-aarch64-apple-darwin \
            ../desktop/src-tauri/binaries/crowbar-api-x86_64-apple-darwin \
            -output ../desktop/src-tauri/binaries/crowbar-api-universal-apple-darwin
      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: cd web && bun install --frozen-lockfile && bun run build
      - name: Sync version into tauri.conf.json
        run: jq ".version = \"${VERSION}\"" desktop/src-tauri/tauri.conf.json > /tmp/tc.json && mv /tmp/tc.json desktop/src-tauri/tauri.conf.json
      - name: Compile Liquid Glass icon (Xcode 26+ only)
        run: bash desktop/icons-compiler/compile-icon.sh
      - name: Build Tauri app (universal DMG)
        env:
          # Signing + notarization are opt-in: when these secrets are unset they
          # expand to empty strings and the script builds the same ad-hoc
          # (unsigned) DMG as before. See desktop/scripts/build-macos-dmg.sh.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash desktop/scripts/build-macos-dmg.sh
      - name: Verify artifact
        run: |
          DMG=$(find desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          [ -s "$DMG" ] || (echo "DMG missing or empty" && exit 1)
          echo "DMG: $DMG ($(du -h "$DMG" | cut -f1))"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  desktop-linux:
    needs: derive-tag
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.derive-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache-dependency-path: api/go.sum
      - uses: oven-sh/setup-bun@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: cargo-bins/cargo-binstall@main
      - name: Install tauri-cli
        run: cargo binstall tauri-cli@^2 --no-confirm --locked
      - name: Build Go sidecar (Linux x86_64)
        run: |
          mkdir -p desktop/src-tauri/binaries
          cd api && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags noEmbed \
            -o ../desktop/src-tauri/binaries/crowbar-api-x86_64-unknown-linux-gnu ./cmd/crowbar
      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: cd web && bun install --frozen-lockfile && bun run build
      - name: Sync version into tauri.conf.json
        run: jq ".version = \"${VERSION}\"" desktop/src-tauri/tauri.conf.json > /tmp/tc.json && mv /tmp/tc.json desktop/src-tauri/tauri.conf.json
      - name: Build Tauri app (AppImage + deb)
        working-directory: desktop/src-tauri
        run: |
          cargo tauri build --bundles appimage,deb \
            --config '{"bundle":{"macOS":{"files":{}}}}'
      - name: Verify artifacts
        run: |
          APPIMAGE=$(find desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          [ -s "$APPIMAGE" ] || (echo "AppImage missing or empty" && exit 1)
          echo "AppImage: $APPIMAGE ($(du -h "$APPIMAGE" | cut -f1))"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb

  release:
    needs: [derive-tag, daemon, desktop-macos, desktop-linux]
    # All jobs must succeed — no partial pre-releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts/
          merge-multiple: true
      - name: Generate unified SHA256SUMS
        run: |
          cd release-artifacts
          find . -type f ! -name 'SHA256SUMS' -exec sha256sum {} \; | sed 's|./||' > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.derive-tag.outputs.tag }}
          name: "Crowbar ${{ needs.derive-tag.outputs.tag }}"
          prerelease: true
          files: release-artifacts/**/*
          generate_release_notes: true
