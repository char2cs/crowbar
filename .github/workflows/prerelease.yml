name: Pre-release

on:
  push:
    branches:
      - 'prerelease/**'

# Cancel previous runs on the same branch — one beta at a time
concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  derive-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      timestamp: ${{ steps.tag.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute beta tag
        id: tag
        run: |
          VERSION=$(grep -m1 '^version' app/mobile/src-tauri/Cargo.toml | grep -oP '[\d.]+')
          BETA_NUM=$(( $(git tag -l "v${VERSION}-beta.*" | wc -l | tr -d ' ') + 1 ))
          TAG="v${VERSION}-beta.${BETA_NUM}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "Pre-release tag: ${TAG}"

  daemon:
    needs: derive-tag
    # The darwin watcher is an FSEvents stream (cgo), so darwin binaries build on
    # a macOS runner; Linux stays CGO_ENABLED=0.
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            platforms: linux/amd64 linux/arm64
            cgo: '0'
          - os: darwin
            runner: macos-26
            platforms: darwin/amd64 darwin/arm64
            cgo: '1'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache-dependency-path: api/go.sum
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_BUILD_CHANNEL: beta
          VITE_BUILD_VERSION: ${{ needs.derive-tag.outputs.tag }}
          VITE_BUILD_TIMESTAMP: ${{ needs.derive-tag.outputs.timestamp }}
        run: cd app/panes && bun install --frozen-lockfile && bun run build
      - name: Stage web assets for embedding
        run: cd api && make embed-web
      - name: Build daemon
        run: |
          mkdir -p dist
          cd api
          for PLATFORM in ${{ matrix.platforms }}; do
            OS=${PLATFORM%/*}; ARCH=${PLATFORM#*/}
            GOOS=$OS GOARCH=$ARCH CGO_ENABLED=${{ matrix.cgo }} go build \
              -o ../dist/crowbar-api-${OS}-${ARCH} ./cmd/crowbar
          done
      - uses: actions/upload-artifact@v7
        with:
          name: daemon-binaries-${{ matrix.os }}
          path: dist/

  ios:
    needs: derive-tag
    uses: ./.github/workflows/ios-build.yml
    secrets: inherit
    with:
      version: ${{ needs.derive-tag.outputs.version }}
      channel: beta
      build-version: ${{ needs.derive-tag.outputs.tag }}
      timestamp: ${{ needs.derive-tag.outputs.timestamp }}

  release:
    needs: [derive-tag, daemon, ios]
    # All jobs must succeed — no partial pre-releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts/
          merge-multiple: true
      # Quiver addresses release assets as Crowbar_${REF}_*, where REF is the git tag it
      # resolved. The bundles are named from the app version, so without this the tag and the
      # filename disagree and every arrow.yaml would have to restate the version.
      - name: Rename app bundles to the release tag
        env:
          TAG: ${{ needs.derive-tag.outputs.tag }}
        run: |
          cd release-artifacts
          find . -type f -name 'Crowbar_*' | while read -r f; do
            base=$(basename "$f")
            suffix=${base#Crowbar_*_}
            new="Crowbar_${TAG}_${suffix}"
            if [ "$base" != "$new" ]; then
              mv "$f" "$(dirname "$f")/${new}"
              echo "renamed ${base} -> ${new}"
            fi
          done
      - name: Generate unified SHA256SUMS
        run: |
          cd release-artifacts
          find . -type f ! -name 'SHA256SUMS' -exec sha256sum {} \; | sed 's|./||' > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.derive-tag.outputs.tag }}
          name: "Crowbar ${{ needs.derive-tag.outputs.tag }}"
          prerelease: true
          files: release-artifacts/**/*
          generate_release_notes: true
