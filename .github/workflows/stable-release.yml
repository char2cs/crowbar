name: Stable Release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  guard:
    # Triggers on:
    # - prerelease/* → master  (normal release flow)
    # - hotfix/* → master      (emergency fix, no prerelease cycle)
    # - release-please--branches--master--* → master  (release-please version bump after hotfix)
    if: >
      github.event.pull_request.merged == true && (
        startsWith(github.head_ref, 'prerelease/') ||
        startsWith(github.head_ref, 'hotfix/') ||
        startsWith(github.head_ref, 'release-please--branches--master--')
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - name: Read version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version' app/mobile/src-tauri/Cargo.toml | grep -oP '[\d.]+')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Stable release: v${VERSION}"

  daemon:
    needs: guard
    # The darwin watcher is an FSEvents stream (cgo), so darwin binaries build on
    # a macOS runner; Linux stays CGO_ENABLED=0.
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            platforms: linux/amd64 linux/arm64
            cgo: '0'
          - os: darwin
            runner: macos-26
            platforms: darwin/amd64 darwin/arm64
            cgo: '1'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache-dependency-path: api/go.sum
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_BUILD_CHANNEL: release
          VITE_BUILD_VERSION: ${{ needs.guard.outputs.tag }}
        run: cd app/panes && bun install --frozen-lockfile && bun run build
      - name: Stage web assets for embedding
        run: cd api && make embed-web
      - name: Build daemon
        run: |
          mkdir -p dist
          cd api
          for PLATFORM in ${{ matrix.platforms }}; do
            OS=${PLATFORM%/*}; ARCH=${PLATFORM#*/}
            GOOS=$OS GOARCH=$ARCH CGO_ENABLED=${{ matrix.cgo }} go build \
              -o ../dist/crowbar-api-${OS}-${ARCH} ./cmd/crowbar
          done
      - uses: actions/upload-artifact@v7
        with:
          name: daemon-binaries-${{ matrix.os }}
          path: dist/

  desktop:
    needs: guard
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit
    with:
      version: ${{ needs.guard.outputs.version }}
      channel: release
      build-version: ${{ needs.guard.outputs.tag }}
      artifact-prefix: desktop

  ios:
    needs: guard
    uses: ./.github/workflows/ios-build.yml
    secrets: inherit
    with:
      ref: master
      version: ${{ needs.guard.outputs.version }}
      channel: release
      build-version: ${{ needs.guard.outputs.tag }}

  release:
    needs: [guard, daemon, desktop, ios]
    # All jobs must succeed — no partial stable releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts/
          merge-multiple: true
      # Quiver addresses release assets as Crowbar_${REF}_*, where REF is the git tag it
      # resolved. The bundles are named from the app version, so without this the tag and the
      # filename disagree and every arrow.yaml would have to restate the version.
      - name: Rename app bundles to the release tag
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          cd release-artifacts
          find . -type f -name 'Crowbar_*' | while read -r f; do
            base=$(basename "$f")
            suffix=${base#Crowbar_*_}
            new="Crowbar_${TAG}_${suffix}"
            if [ "$base" != "$new" ]; then
              mv "$f" "$(dirname "$f")/${new}"
              echo "renamed ${base} -> ${new}"
            fi
          done
      - name: Generate unified SHA256SUMS
        run: |
          cd release-artifacts
          find . -type f ! -name 'SHA256SUMS' -exec sha256sum {} \; | sed 's|./||' > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          name: "Crowbar ${{ needs.guard.outputs.tag }}"
          prerelease: false
          make_latest: true
          files: release-artifacts/**/*
          generate_release_notes: true

  backport:
    needs: [guard, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Open backport PR to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          BRANCH="backport/v${VERSION}"

          git checkout -b "$BRANCH" origin/develop

          # Conflicts are expected when develop has diverged significantly.
          # Push the branch regardless so the PR can be resolved manually.
          if ! git merge --no-ff origin/master -m "chore: backport ${TAG} to develop"; then
            echo "⚠️ Merge conflicts detected — pushing branch for manual resolution"
            git add -A
            git commit -m "chore: backport ${TAG} to develop (conflicts need resolution)"
          fi

          git push origin "$BRANCH"

          gh pr create \
            --title "chore: backport ${TAG} to develop" \
            --body "Backport stable release ${TAG} from \`master\` to \`develop\`." \
            --base develop \
            --head "$BRANCH" \
            --label "backport"
