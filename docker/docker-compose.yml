# Pinned: the default project name is the directory ("docker"), so `down -v` from
# another compose file there would delete the volume holding the TLS identity.
name: crowbar

services:
  crowbar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # "embed" bakes in web/dist (build it first); "none" is a headless API-only daemon.
        WEB: ${CROWBAR_WEB:-embed}
    # One tag per variant, so building "none" does not overwrite the "embed" image.
    image: ghcr.io/rabbytesoftware/crowbar:${CROWBAR_WEB:-embed}
    ports:
      # Self-signed TLS: connect to https://localhost:${CROWBAR_PORT:-3737}; plain http gets 400.
      - "${CROWBAR_PORT:-3737}:3737"
    volumes:
      # TLS identity and paired clients; losing it makes every client re-pair. A named volume,
      # not a bind mount: Docker Desktop on macOS cannot host the daemon's unix socket on one.
      # A /root/.crowbar volume from the old root-user image is not picked up; recreate it.
      - crowbar-data:/home/crowbar/.crowbar
      # Repos created on the remote must live under here to survive the container. A bind
      # mount works too; on Linux `chown 1000:1000` the host directory first.
      - crowbar-projects:/home/crowbar/projects
      # ssh clones need a key and known_hosts, which a fresh container lacks (chmod 600 the key):
      # - ~/.ssh/id_ed25519:/home/crowbar/.ssh/id_ed25519:ro
      # - ~/.ssh/known_hosts:/home/crowbar/.ssh/known_hosts:ro
    # `git config --global` is stored in the crowbar-data volume (GIT_CONFIG_GLOBAL), so a
    # commit identity set once survives recreates. Or pin one here:
    # environment:
    #   GIT_AUTHOR_NAME: Your Name
    #   GIT_AUTHOR_EMAIL: you@example.com
    #   GIT_COMMITTER_NAME: Your Name
    #   GIT_COMMITTER_EMAIL: you@example.com
    restart: unless-stopped

volumes:
  crowbar-data:
  crowbar-projects:
