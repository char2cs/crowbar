services:
  crowbar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/rabbytesoftware/crowbar:latest
    ports:
      - "3737:3737"
    volumes:
      - crowbar-data:/root/.crowbar
    environment:
      - CROWBAR_HOST=tcp://0.0.0.0:3737
    restart: unless-stopped

volumes:
  crowbar-data:
